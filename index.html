<script>
  // Launch guard for the shifted screen: measure the real screen, pin the page to it, put the page back at 0,0,
  // and if the iPhone is still reporting a stale size make it measure again. Runs at launch, a few more times in
  // the first seconds, and whenever the app comes back, rotates or resizes. It never reloads the app.
  (function(){
    var root = document.documentElement, nudges = 0, last = '';
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = function(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches); };
    var angle = function(){ var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : window.orientation; return typeof a === 'number' ? Math.abs(a) % 180 : null; };
    // what the screen really is: on an iPhone home-screen app that is the whole display, turned the way the phone is held
    function real(){
      var w = window.innerWidth, h = window.innerHeight, a = angle();
      if (ios && standalone() && a !== null && screen.width && screen.height) {
        var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        var ew = a === 90 ? long : short, eh = a === 90 ? short : long;
        // only a big gap is a stale size (the page still thinks the phone is the other way up); small gaps are real bars
        if (Math.abs(w - ew) > 60 || Math.abs(h - eh) > 60) return { w:ew, h:eh, stale:true };
      }
      return { w:w, h:h, stale:false };
    }
    function settle(){
      try {
        var r = real(), vv = window.visualViewport;
        root.style.setProperty('--app-h', r.h + 'px');
        var moved = window.scrollX || window.scrollY || root.scrollTop || (document.body && document.body.scrollTop) || (vv && (vv.offsetTop || vv.offsetLeft || vv.pageTop || vv.pageLeft));
        if (moved) { window.scrollTo(0, 0); root.scrollTop = 0; if (document.body) document.body.scrollTop = 0; }
        if ((r.stale || moved) && nudges < 6) {                      // make the iPhone lay the page out again
          nudges++;
          var m = document.querySelector('meta[name=viewport]'), c = m && m.getAttribute('content');
          if (m) { m.setAttribute('content', c + ', height=device-height'); setTimeout(function(){ m.setAttribute('content', c); }, 60); }
        }
        var key = r.w + 'x' + r.h + (r.stale ? 's' : '') + (moved ? 'm' : '');
        if (key !== last) { last = key; setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 80); }   // the game re-fits its court
      } catch (e) {}
    }
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    settle();
    [0, 60, 150, 300, 600, 1000, 1600, 2500, 4000].forEach(function(ms){ setTimeout(settle, ms); });
    ['DOMContentLoaded', 'load', 'pageshow', 'resize', 'orientationchange', 'focus'].forEach(function(ev){ window.addEventListener(ev, function(){ settle(); setTimeout(settle, 250); setTimeout(settle, 700); }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) { nudges = 0; settle(); setTimeout(settle, 250); setTimeout(settle, 700); } });
    if (window.visualViewport) { visualViewport.addEventListener('resize', settle); visualViewport.addEventListener('scroll', settle); }
  })();
</script>

<script>
(() => {
"use strict";
/* ───────────────────────────────────────────────────────────────────────────
   RETRO BASEBALL
   Swipe up to swing. Pick a pitch and a spot to pitch. Nine innings.
   Everything is drawn as pixel art on one small canvas that is scaled up, so
   the whole game stays sharp on a phone held sideways.
   ─────────────────────────────────────────────────────────────────────────── */

let W = 428, H = 240;                   // the pixel canvas: fixed height, width follows the screen
const cv = document.getElementById('cv'), g = cv.getContext('2d', { alpha:false });
let SC = 1, OX = 0, OY = 0;                   // scale and letterbox offset, for turning taps into pixels

function fit(){
  const w = innerWidth, h = innerHeight, dpr = Math.min(3, devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  W = clamp(Math.round(H * (cv.width / cv.height)), 300, 536);   // the picture is 760x492, so it is shown whole with side bars on wider phones
  SC = cv.height / H;
  OX = (cv.width - W * SC) / 2; OY = 0;
  ZONE.x = W / 2 - ZONE.w / 2;
  g.imageSmoothingEnabled = false;
}
// fit() is called once ZONE exists, further down

// ── little helpers ─────────────────────────────────────────────────────────
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const ri = (a, b) => Math.floor(rnd(b + 1, a));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
// bell-curve random: averages out, so extremes are rare
const bell = () => (Math.random() + Math.random() + Math.random()) / 3;
// roughly a standard normal: mean 0, standard deviation 1
const gauss = () => (Math.random() + Math.random() + Math.random() + Math.random()
                   + Math.random() + Math.random() - 3) * 1.41;

// ── ratings and their colors (the user's scale) ────────────────────────────
// 60-69 grey, 70-79 green, 80-89 blue, 90-99 yellow, 100-109 orange, 110-120 red
const TIERS = [
  { min:60,  col:'#9aa6bd', name:'Common'    },
  { min:70,  col:'#54d67a', name:'Uncommon'  },
  { min:80,  col:'#4aa3ff', name:'Rare'      },
  { min:90,  col:'#b26bff', name:'Epic'      },
  { min:100, col:'#ffd23f', name:'Legendary' },
  { min:110, col:'#ff4d4d', name:'Mythic'    },
];
const tierOf = v => TIERS[clamp(Math.floor((v - 60) / 10), 0, 5)];
const colOf = v => tierOf(v).col;

// ── the 30 real teams (names only; every player is made up) ────────────────
const TEAMS = [
  ['BAL','Baltimore','Orioles','#df4601','#000000','AL','E'], ['BOS','Boston','Red Sox','#bd3039','#0c2340','AL','E'],
  ['NYY','New York','Yankees','#0c2340','#c4ced3','AL','E'],  ['TB','Tampa Bay','Rays','#092c5c','#8fbce6','AL','E'],
  ['TOR','Toronto','Blue Jays','#134a8e','#e8291c','AL','E'], ['CWS','Chicago','White Sox','#27251f','#c4ced4','AL','C'],
  ['CLE','Cleveland','Guardians','#00385d','#e50022','AL','C'],['DET','Detroit','Tigers','#0c2340','#fa4616','AL','C'],
  ['KC','Kansas City','Royals','#004687','#bd9b60','AL','C'], ['MIN','Minnesota','Twins','#002b5c','#d31145','AL','C'],
  ['HOU','Houston','Astros','#002d62','#eb6e1f','AL','W'],    ['LAA','Los Angeles','Angels','#ba0021','#003263','AL','W'],
  ['ATH','Athletics','Athletics','#003831','#efb21e','AL','W'],['SEA','Seattle','Mariners','#0c2c56','#00714a','AL','W'],
  ['TEX','Texas','Rangers','#003278','#c0111f','AL','W'],     ['ATL','Atlanta','Braves','#13274f','#ce1141','NL','E'],
  ['MIA','Miami','Marlins','#00a3e0','#ef3340','NL','E'],     ['NYM','New York','Mets','#002d72','#ff5910','NL','E'],
  ['PHI','Philadelphia','Phillies','#e81828','#002d72','NL','E'],['WSH','Washington','Nationals','#ab0003','#14225a','NL','E'],
  ['CHC','Chicago','Cubs','#0e3386','#cc3433','NL','C'],      ['CIN','Cincinnati','Reds','#c6011f','#000000','NL','C'],
  ['MIL','Milwaukee','Brewers','#12284b','#ffc52f','NL','C'], ['PIT','Pittsburgh','Pirates','#27251f','#fdb827','NL','C'],
  ['STL','St. Louis','Cardinals','#c41e3a','#0c2340','NL','C'],['ARI','Arizona','Diamondbacks','#a71930','#000000','NL','W'],
  ['COL','Colorado','Rockies','#333366','#c4ced4','NL','W'],  ['LAD','Los Angeles','Dodgers','#005a9c','#ef3e42','NL','W'],
  ['SD','San Diego','Padres','#2f241d','#ffc425','NL','W'],   ['SF','San Francisco','Giants','#fd5a1e','#27251f','NL','W'],
].map(t => ({ ab:t[0], city:t[1], nick:t[2], c1:t[3], c2:t[4], lg:t[5], div:t[6] }));

// ── made-up player names ───────────────────────────────────────────────────
const FIRST = ['Cole','Hank','Marco','Ty','Deion','Rico','Jax','Nolan','Ozzie','Luis','Kai','Brett','Dax','Omar','Cruz','Sal',
  'Rhett','Milo','Zeke','Trey','Dusty','Cash','Vance','Pablo','Rory','Kip','Sandy','Bo','Junior','Ace','Kenji','Isaia','Tito',
  'Wes','Duke','Gus','Hollis','Reggie','Yuki','Diego','Shane','Buck','Moe','Elio','Rocco','Jett','Levi','Cy','Nico','Bram'];
const LAST = ['Vasquez','Okafor','Brandt','Delgado','Cobb','Hollins','Tanaka','Mercer','Rios','Falk','Whitmore','Nakamura',
  'Baptiste','Kowalski','Sutter','Ferrell','Ortiz','Grady','Lindqvist','Beaumont','Castillo','Pike','Mullen','Araya','Stroud',
  'Vega','Barnhart','Oyelaran','Lacroix','Prescott','Guzman','Boone','Ishikawa','Reyes','Hatcher','Quill','Marchetti','Dupree',
  'Salazar','Crowe','Abara','Thibault','Youngblood','Esparza','Mahoney','Nkemelu','Rask','Tovar','Winslow','Zamora'];
const POS = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];

// how much each spot leans on each rating, so a shortstop fields and a corner bat hits
const POSBIAS = {
  C:  { fielding:8,  speed:-10, power:2,  contact:0 },  '1B': { fielding:-2, speed:-8, power:9,  contact:1 },
  '2B':{ fielding:5,  speed:5,   power:-6, contact:4 },  '3B': { fielding:4,  speed:-2, power:6,  contact:0 },
  SS: { fielding:9,  speed:6,   power:-5, contact:2 },  LF:  { fielding:-1, speed:2,  power:5,  contact:1 },
  CF: { fielding:6,  speed:9,   power:-2, contact:2 },  RF:  { fielding:2,  speed:2,  power:7,  contact:0 },
  DH: { fielding:-14,speed:-6,  power:9,  contact:5 },
};

function makeHitter(level, pos){
  const base = () => clamp(Math.round(level + (bell() - .5) * 26), 60, 120);
  const b = POSBIAS[pos] || POSBIAS.DH;
  const p = {
    name: pick(FIRST) + ' ' + pick(LAST), pos,
    contact: clamp(base() + b.contact, 60, 120), power: clamp(base() + b.power, 60, 120),
    speed: clamp(base() + b.speed, 60, 120),   fielding: clamp(base() + b.fielding, 60, 120),
    bats: chance(.3) ? 'L' : 'R', look: look(),
  };
  p.speed = p.fielding;                                              // his speed IS his fielding rating
  p.ovr = Math.round((p.contact + p.power + p.speed + p.fielding) / 4);
  p.st = newStat();
  return p;
}
function makePitcher(level, role){
  const base = () => clamp(Math.round(level + (bell() - .5) * 26), 60, 120);
  const p = {
    name: pick(FIRST) + ' ' + pick(LAST), pos: role,          // 'SP' | 'RP' | 'CP'
    velocity: base(), control: base(), stamina: role === 'SP' ? base() : clamp(base() - 14, 60, 120),
    batting: clamp(Math.round(62 + bell() * 16), 60, 120),
    throws: chance(.28) ? 'L' : 'R', look: look(),
  };
  p.ovr = Math.round((p.velocity + p.control + p.stamina + p.batting) / 4);
  // 2-4 pitches, each with its own rating; everybody owns a fastball
  const all = ['FB','CV','SL','CH'];
  const n = 2 + (p.ovr > 95 ? 2 : p.ovr > 80 ? 1 : 0) + (chance(.4) ? 1 : 0);
  p.pitches = {};
  ['FB', ...all.slice(1).sort(() => Math.random() - .5)].slice(0, clamp(n, 2, 4))
    .forEach(k => p.pitches[k] = clamp(Math.round(p.ovr + (bell() - .5) * 22), 60, 120));
  p.st = newStat();
  return p;
}
const newStat = () => ({ ab:0, h:0, d:0, t:0, hr:0, rbi:0, r:0, bb:0, hbp:0, sf:0, k:0, ip:0, po:0, er:0, ko:0, ha:0, bba:0, fbn:0, fbs:0, w:0, l:0, sb:0, pa:0 });
// a face/body recipe so every player looks different
function look(){
  return { skin: pick(['#f2c9a0','#e0ad7e','#c88e5e','#9c6336','#6f4324','#4b2d18']),
           hair: pick(['#120d0a','#2b1a10','#5a3a1c','#8a6a2a','#c8a04a','#d8d8d8','#120d0a','#2b1a10']),
           beard: chance(.4) ? 1 : 0, bulk: rnd(1.15, .85) };
}

// ── season-long state ──────────────────────────────────────────────────────
const BUILD = '11-12o';
const SAVE = 'retrobaseball.v1';
const START_COINS = 27500;                                // a new save starts with 2,500 and a 25,000 bonus
const SRC = p => (window.EMB && window.EMB[p]) || p;      // recolourable sprites come from embed.js when the page is opened as a file
let G = null;

// a whole roster: nine hitters, five starters, five relievers (the last is the closer, 4 better). The computer's players are 80-120 around the club's level q; yours start at 60-75.
function makeRoster(mine, q){
  const lv = () => mine ? rnd(75, 60) : clamp(q + (bell() - .5) * 16, 80, 120);
  const hit = pos => { const L = lv(); return fitTo(makeHitter(L, pos), L); };
  const arm = (role, plus) => { const L = clamp(lv() + plus, 60, 120); return fitTo(makePitcher(L, role), L); };
  const lineup = POS.map(p => hit(p));
  const rot = [0,1,2,3,4].map(() => arm('SP', 0));
  const pen = [0,1,2,3].map(() => arm('RP', 0)).concat([arm('CP', 4)]);
  [...lineup, ...rot, ...pen].forEach(p => { p.num = ri(1, 72); });
  return { lineup, rot, pen };
}
function newGame(teamAb){
  try { localStorage.removeItem('retrobaseball.match.v1'); } catch (e){}
  _cardId = 1;
  // the league: every other club has its own level (a weak one averages about 86, a strong one about 100) with players of 80-105; you start with 60-75 cards, the worst team in the game
  const teams = TEAMS.map(t => {
    const mine = t.ab === teamAb, q = rnd(112, 84), r = makeRoster(mine, q);
    return { ...t, lineup:r.lineup, rot:r.rot, pen:r.pen, w:0, l:0, rs:0, ra:0, q };
  });
  G = { v:2, team: teams.findIndex(t => t.ab === teamAb), teams, day:0, coins:START_COINS, gift25k:true, fun1m:true, seen:{}, streak:{ day:0, last:'' }, seasonLen:24,
        sched:[], rotIdx:0, cards:[], slots:{ lineup:[], rot:[], pen:[] }, freeAt:0 };
  // your own nine, five starters and five relievers all become cards you own
  const me = G.teams[G.team];
  const own = p => { p.id = _cardId++; p.lvl = 0; p.ovr = ovrOf(p); G.cards.push(p); return p.id; };
  G.slots.lineup = me.lineup.map(own);
  G.slots.rot = me.rot.map(own);
  G.slots.pen = me.pen.map(own);
  makeSchedule();
  G.leagueV = 3;
  save();
}
// point the team at whatever cards are in the slots right now
function rebuildTeam(){
  const me = G.teams[G.team];
  const get = id => cardById(id) || me.lineup[0];
  me.lineup = G.slots.lineup.map(get);
  if (!G.slots.order || G.slots.order.length !== 9) G.slots.order = IDENT9.slice();
  me.order = G.slots.order;
  me.rot = G.slots.rot.map(get);
  me.pen = G.slots.pen.map(get);
}
function makeLeagueSchedule(){
  const N = G.teams.length, shuf = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const divOf = i => G.teams[i].lg + G.teams[i].div, divs = {};
  G.teams.forEach((t, i) => (divs[divOf(i)] = divs[divOf(i)] || []).push(i));
  const key = (x, y) => x < y ? x + '-' + y : y + '-' + x, seen = new Set(), dk = Object.keys(divs);
  // each division: 5 teams, 5 rounds of two series (one team sits out each round)
  const rr = {};
  dk.forEach(k => {
    const arr = [-1].concat(shuf(divs[k].slice())), rounds = [];
    for (let r = 0; r < 5; r++){
      const rot = arr.slice(1), a = [arr[0]].concat(rot.map((_, i) => rot[(i - r + 5) % 5])), pairs = []; let bye = -1;
      for (let i = 0; i < 3; i++){ const x = a[i], y = a[5 - i]; if (x === -1) bye = y; else if (y === -1) bye = x; else pairs.push([x, y]); }
      rounds.push({ pairs, bye });
    }
    rr[k] = shuf(rounds);
  });
  const divSlots = shuf([0, 1, 2, 3, 4, 5, 6, 7]).slice(0, 5).sort((p, q) => p - q), rounds = [];
  for (let slot = 0; slot < 8; slot++){
    const pairs = []; const j = divSlots.indexOf(slot);
    if (j >= 0){
      dk.forEach(k => rr[k][j].pairs.forEach(p => pairs.push(p.slice())));
      let byes; for (let tryN = 0; tryN < 60; tryN++){ byes = shuf(dk.map(k => rr[k][j].bye)); if (byes.every((_, i) => i % 2 || !seen.has(key(byes[i], byes[i + 1])))) break; }
      for (let i = 0; i < byes.length; i += 2){ pairs.push([byes[i], byes[i + 1]]); seen.add(key(byes[i], byes[i + 1])); }   // the idle clubs play each other
    } else {
      for (let tryN = 0; tryN < 400; tryN++){                                         // everybody plays a club from another division, nobody twice
        const ids = shuf(Array.from({ length:N }, (_, i) => i)), used = new Set(), out = []; let ok = true;
        for (const i of ids){
          if (used.has(i)) continue;
          const o = ids.find(q => q !== i && !used.has(q) && divOf(q) !== divOf(i) && !seen.has(key(i, q)));
          if (o === undefined){ ok = false; break; }
          used.add(i); used.add(o); out.push([i, o]);
        }
        if (ok){ out.forEach(p => { pairs.push(p); seen.add(key(p[0], p[1])); }); break; }
      }
    }
    pairs.forEach(p => { if (Math.random() < .5) p.reverse(); });                    // who is home in games 1 and 3
    rounds.push(pairs);
  }
  return rounds;
}
function makeSchedule(){
  G.rounds = makeLeagueSchedule();
  G.sched = [];
  for (let d = 0; d < G.seasonLen; d++){
    const pair = (G.rounds[Math.floor(d / 3)] || []).find(p => p.includes(G.team)), k = d % 3;
    const opp = pair ? (pair[0] === G.team ? pair[1] : pair[0]) : (G.team + 1) % G.teams.length, first = !pair || pair[0] === G.team;
    G.sched.push({ opp, home: k === 1 ? !first : first, done:false, rs:0, ra:0 });
  }
}
let saveFailed = false;
const save = () => {
  const me = G && G.teams && G.teams[G.team];
  const keep = me ? { lineup:me.lineup, rot:me.rot, pen:me.pen } : null;
  try {
    // our own players live in G.cards; the team just points at them, so blank those
    // three lists before saving and build them again on load
    me.lineup = me.rot = me.pen = null;
    const txt = JSON.stringify(G);
    me.lineup = keep.lineup; me.rot = keep.rot; me.pen = keep.pen;
    localStorage.setItem(SAVE, txt); saveFailed = false;
  } catch(e){ saveFailed = true; }
  finally { if (me && keep && !me.lineup){ me.lineup = keep.lineup; me.rot = keep.rot; me.pen = keep.pen; } }       // however it ended, the team is put back
};

function injectLeague(){
  G.teams.forEach((t, i) => { t.w = t.l = t.rs = t.ra = 0; if (i !== G.team){ t.q = rnd(112, 84); Object.assign(t, makeRoster(false, t.q)); } });      // new, stronger computer clubs
  G.seasonLen = 24; G.po = null; G.season = (G.season || 1) + 1;
  makeSchedule();                                                                          // a fresh 24-game schedule
  const myRes = Array.from({ length:17 }, (_, i) => i < 10);                               // you are 10-7 after 17 games, in a random order
  for (let i = myRes.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [myRes[i], myRes[j]] = [myRes[j], myRes[i]]; }
  const pWin = (a, b) => 1 / (1 + Math.exp(-(G.teams[a].q - G.teams[b].q) / 12));         // everyone else: the better club wins more often
  for (let d = 0; d < 17; d++){
    (G.rounds[Math.floor(d / 3)] || []).forEach(([a, b]) => {
      const aw = a === G.team ? myRes[d] : b === G.team ? !myRes[d] : Math.random() < pWin(a, b);
      const wr = ri(3, 9), lr = ri(0, wr - 1), w = aw ? a : b, l = aw ? b : a;
      G.teams[w].w++; G.teams[l].l++; G.teams[w].rs += wr; G.teams[w].ra += lr; G.teams[l].rs += lr; G.teams[l].ra += wr;
      if (a === G.team || b === G.team){ const sg = G.sched[d], won = w === G.team; if (sg){ sg.done = true; sg.rs = won ? wr : lr; sg.ra = won ? lr : wr; } }
    });
  }
  G.day = 17;
  G.teams.forEach(t => [...(t.lineup || []), ...(t.rot || []), ...(t.pen || [])].forEach(p => { p.st = newStat(); }));      // every stat back to zero
  G.cards.forEach(p => { p.st = newStat(); p.stam = 1; });
  G.leagueV = 3;
  try { localStorage.removeItem('retrobaseball.match.v1'); } catch (e){}                  // a game in progress from the old league cannot be resumed
  save();
}
const load = () => {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE));
    if (d && d.v === 2){
      G = d;
      _cardId = Math.max(1, ...G.cards.map(c => c.id || 0)) + 1;
      G.cards.forEach(c => { c.st = c.st || newStat(); if (c.fielding != null) c.speed = c.fielding; });
      rebuildTeam();
      if (!G.seen){ G.seen = {}; G.cards.forEach(c => { G.seen[c.name] = 1; }); }
      if (!G.streak) G.streak = { day:0, last:'' };
      if (G.packReset !== 2){ G.freeAt = 0; G.packReset = 2; }                    // one-time: the daily pack that glitched is available again
      if (G.leagueV !== 3) injectLeague();                                        // one-time: the stronger league, game 17 of 24 at 10-7, stats reset
      G.cards.forEach(c => { if (c.fz == null) c.fz = 0; });
      if (!G.gift25k){                                                       // the 1,000,000 gift is taken back and replaced by a one-time 25,000
        G.gift25k = true;
        if (G.gift1m) G.coins = Math.max(25000, G.coins - 975000); else G.coins += 25000;
        save();
      }
    }
  } catch(e){}
};
const myTeam = () => G.teams[G.team];

// ───────────────────────────────────────────────────────────────────────────
//  PIXEL ART
//  Everything is drawn with small rectangles so it stays crisp when scaled up.
// ───────────────────────────────────────────────────────────────────────────
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); };
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v + 255 * amt), 0, 255);
  return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
};
const MONO = 'ui-monospace, "Courier New", monospace', PIXF = '"Silkscreen", "Courier New", monospace';
let FONT = PIXF;                                          // menus: the pixel font. Cards switch to MONO while they draw.
const fontOf = size => FONT === PIXF ? `${Math.max(5, size * .86).toFixed(1)}px ${PIXF}` : `${size}px ${MONO}`;
try { document.fonts.load('400 10px Silkscreen'); document.fonts.load('700 10px Silkscreen'); } catch (e) {}
// squeeze a string into maxW: smaller type first (down to 4.6px), then an ellipsis
function fitText(s, size, maxW){
  g.font = fontOf(size);
  if (!maxW) return s;
  let sz = size, w = g.measureText(s).width;
  while (w > maxW && sz > 4.6){ sz -= .35; g.font = fontOf(sz); w = g.measureText(s).width; }
  while (w > maxW && s.length > 1){ s = s.slice(0, -2) + '…'; w = g.measureText(s).width; if (s.length <= 2) break; }
  return s;
}
function text(s, x, y, c = '#fff', size = 7, align = 'left', maxW){
  s = fitText(String(s), size, maxW);
  g.textAlign = align; g.textBaseline = 'top'; g.fillStyle = c;
  g.fillText(s, x | 0, y | 0);
}
function textb(s, x, y, c = '#fff', size = 7, align = 'left', maxW){
  // Small text gets a single soft shadow; big callouts get a full outline so they
  // carry over the grass and the crowd. A heavy outline on small text reads as a smudge.
  s = fitText(String(s), size, maxW);
  g.textAlign = align; g.textBaseline = 'top';
  g.fillStyle = 'rgba(0,0,0,.72)';
  if (size >= 10) [[1,0],[-1,0],[0,1],[0,-1]].forEach(d => g.fillText(s, (x + d[0]) | 0, (y + d[1]) | 0));
  else g.fillText(s, (x + 1) | 0, (y + 1) | 0);
  g.fillStyle = c; g.fillText(s, x | 0, y | 0);
}

/* ───────────────────────────────────────────────────────────────────────────
   PIXEL RIG — the same way Retro Boxing draws its fighters.
   Shapes are rasterised into a pixel grid, shaded band by band, then given a
   dark outline. Every sprite is built once and cached, so the game only pays
   for it the first time a pose is seen.
   ─────────────────────────────────────────────────────────────────────────── */
const RW = 112, RH = 108;                       // the pixel grid one player is drawn on
const OUTL = '#120c18';

// ── colour maths ───────────────────────────────────────────────────────────
function hexToHsl(h){
  let [r, gq, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const mx = Math.max(r, gq, b), mn = Math.min(r, gq, b), l = (mx + mn) / 2;
  let hh = 0, s = 0;
  if (mx !== mn){ const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    hh = mx === r ? (gq - b) / d + (gq < b ? 6 : 0) : mx === gq ? (b - r) / d + 2 : (r - gq) / d + 4; hh /= 6; }
  return [hh * 360, s, l];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360 / 360; l = clamp(l, 0, 1);
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
    return Math.round((l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255); };
  return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('');
}
// a ramp of shades from one colour: [hue shift, saturation x, lightness x, lift toward white]
function ramp(base, spec){
  const [h, s, l] = hexToHsl(base);
  return spec.map(([dh, ds, dl, lift]) =>
    hslToHex(h + dh, clamp(s * ds, 0, 1), lift ? l + (1 - l) * lift : l * dl));
}
const MIXC = new Map();                                        // a card is drawn from hundreds of mixed colours every frame: each one is worked out once
function mix(a, b, t){
  const q = Math.round(clamp(t, 0, 1) * 255), key = a + b + q; let v = MIXC.get(key); if (v) return v;
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16), u = q / 255;
  v = '#' + [16, 8, 0].map(sh => Math.round(lerp((A >> sh) & 255, (B >> sh) & 255, u)))
    .map(x => x.toString(16).padStart(2, '0')).join('');
  MIXC.set(key, v); return v;
}

// every colour one player is painted with
function palette(look, c1, c2){
  const [s1, s2, s3, s4, s5] = ramp(look.skin, [[-16,.8,.34],[-9,.9,.58],[-4,.95,.82],[0,1,1],[6,.9,0,.34]]);
  const [j1, j2, j3, j4] = ramp(c1, [[-5,.9,.5],[-2,.95,.74],[0,1,1],[5,.9,0,.3]]);
  // pants are the classic off-white; the team colour only tints them a little
  const pantBase = mix(c2 === '#ffffff' ? '#e9ecf2' : c2, '#f2f4f8', .88);
  const [p1, p2, p3] = ramp(pantBase, [[-3,.7,.62],[0,.8,1],[4,.6,0,.28]]);
  const hairBase = look.hair === '#120d0a' ? '#1d1510' : look.hair;
  const [r1, r2, r3] = ramp(hairBase, [[-5,.9,.55],[0,1,1],[5,.85,0,.3]]);
  return { K:OUTL, s1, s2, s3, s4, s5, j1, j2, j3, j4, p1, p2, p3, r1, r2, r3,
           boot:'#1d1a22', boot2:'#2e2a36', eye:'#f2efe6', iris:'#2a1c14',
           bat:'#c79a5c', bat2:'#e0bb86', bat3:'#9a7340', leather:'#8a5f33', leather2:'#ab7a46',
           mesh:'#3a404e', mesh2:'#596273', white:'#f4f2ea' };
}

// ── the rasteriser ─────────────────────────────────────────────────────────
function Rig(PAL){
  const buf = new Array(RW * RH).fill(null);
  const tmp = document.createElement('canvas'); tmp.width = RW; tmp.height = RH;
  const tg = tmp.getContext('2d', { willReadFrequently:true });
  let part = null;
  const C = c => PAL[c] || c;
  // rasterise one shape and hand back which pixels it covers
  const mask = draw => {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const B = (x, y, r = 0) => { if (x-r < x0) x0 = x-r; if (y-r < y0) y0 = y-r; if (x+r > x1) x1 = x+r; if (y+r > y1) y1 = y+r; };
    const rec = { moveTo:(x,y) => { B(x,y); tg.moveTo(x,y); }, lineTo:(x,y) => { B(x,y); tg.lineTo(x,y); },
      closePath:() => tg.closePath(),
      ellipse:(cx,cy,rx,ry,a,b,c) => { B(cx,cy,Math.max(rx,ry)); tg.ellipse(cx,cy,rx,ry,a,b,c); } };
    tg.beginPath(); draw(rec);
    const m = new Uint8Array(RW * RH);
    const bx = Math.max(0, Math.floor(x0) - 1), by = Math.max(0, Math.floor(y0) - 1);
    const bw = Math.min(RW, Math.ceil(x1) + 2) - bx, bh = Math.min(RH, Math.ceil(y1) + 2) - by;
    if (bw <= 0 || bh <= 0) return m;
    tg.clearRect(bx, by, bw, bh); tg.fillStyle = '#000'; tg.fill();
    const a = tg.getImageData(bx, by, bw, bh).data;
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++)
      m[(by + y) * RW + bx + x] = a[(y * bw + x) * 4 + 3] > 127;
    return m;
  };
  const poly = pts => gg => pts.forEach(([x, y], i) => i ? gg.lineTo(x + .5, y + .5) : gg.moveTo(x + .5, y + .5));
  return {
    // a body part: begin, paint into it, end (which adds the dark outline around it)
    begin(){ part = new Array(RW * RH).fill(null); },
    end(plain){
      const has = (x, y) => x >= 0 && y >= 0 && x < RW && y < RH && part[y * RW + x];
      if (!plain) for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++){
        const i = y * RW + x;
        if (!part[i] && (has(x+1,y) || has(x-1,y) || has(x,y+1) || has(x,y-1))) buf[i] = PAL.K;
      }
      for (let i = 0; i < RW * RH; i++) if (part[i]) buf[i] = part[i];
    },
    fill(col, pts){ const m = mask(poly(pts)), c = C(col); for (let i = 0; i < RW*RH; i++) if (m[i]) part[i] = c; },
    ell(col, cx, cy, rx, ry){ const m = mask(gg => gg.ellipse(cx+.5, cy+.5, rx, ry, 0, 0, 7)), c = C(col);
      for (let i = 0; i < RW*RH; i++) if (m[i]) part[i] = c; },
    // paint only where the part already is, for shading on top of a shape
    shade(col, pts){ const m = mask(poly(pts)), c = C(col); for (let i = 0; i < RW*RH; i++) if (m[i] && part[i]) part[i] = c; },
    shadeE(col, cx, cy, rx, ry){ const m = mask(gg => gg.ellipse(cx+.5, cy+.5, rx, ry, 0, 0, 7)), c = C(col);
      for (let i = 0; i < RW*RH; i++) if (m[i] && part[i]) part[i] = c; },
    dot(col, x, y, w = 1, h = 1){ const c = C(col); x = Math.round(x); y = Math.round(y);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
        if (x+i >= 0 && x+i < RW && y+j >= 0 && y+j < RH) part[(y+j) * RW + x+i] = c; },
    line(col, pts){ const c = C(col);
      for (let k = 1; k < pts.length; k++){
        const [ax, ay] = pts[k-1], [bx, by] = pts[k], n = Math.max(Math.abs(bx-ax), Math.abs(by-ay)) || 1;
        for (let t = 0; t <= n; t++){
          const x = Math.round(ax + (bx-ax)*t/n), y = Math.round(ay + (by-ay)*t/n);
          if (x >= 0 && x < RW && y >= 0 && y < RH && part[y*RW+x]) part[y*RW+x] = c;
        } } },
    // an arm or a leg: a tapered tube, lit on one edge and dark on the other
    limb(A, B, w1, w2, set = ['s2','s3','s4','s5'], crease){
      const dx = B[0]-A[0], dy = B[1]-A[1], L = Math.hypot(dx, dy) || 1;
      const vx = dx/L, vy = dy/L, nx = -vy, ny = vx;
      const m = mask(gg => {
        poly([[A[0]+nx*w1/2, A[1]+ny*w1/2], [B[0]+nx*w2/2, B[1]+ny*w2/2],
              [B[0]-nx*w2/2, B[1]-ny*w2/2], [A[0]-nx*w1/2, A[1]-ny*w1/2]])(gg);
        gg.moveTo(A[0]+.5+w1/2, A[1]+.5); gg.ellipse(A[0]+.5, A[1]+.5, w1/2, w1/2, 0, 0, 7);
        gg.moveTo(B[0]+.5+w2/2, B[1]+.5); gg.ellipse(B[0]+.5, B[1]+.5, w2/2, w2/2, 0, 0, 7);
      });
      const lit = (nx * .55 - ny * .84) > 0 ? 1 : -1;
      for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++){
        const i = y*RW + x; if (!m[i]) continue;
        const qx = x - A[0], qy = y - A[1];
        const u = (qx*vx + qy*vy) / L, d = (qx*nx + qy*ny) * lit;
        const w = (w1 + (w2-w1) * clamp(u, 0, 1)) / 2;
        let c = set[2];
        if (d > w - 1.3) c = set[3];
        else if (d < -(w - 1.6)) c = set[1];
        if (crease && u > .3 && u < .8 && Math.abs(d + w*.18) < .55) c = set[0];
        part[i] = C(c);
      }
    },
    toCanvas(){
      const cvv = document.createElement('canvas'); cvv.width = RW; cvv.height = RH;
      const cg = cvv.getContext('2d'), im = cg.createImageData(RW, RH);
      buf.forEach((c, i) => { if (!c) return; const n = parseInt(c.slice(1), 16);
        im.data[i*4] = n >> 16; im.data[i*4+1] = (n >> 8) & 255; im.data[i*4+2] = n & 255; im.data[i*4+3] = 255; });
      cg.putImageData(im, 0, 0); return cvv;
    },
  };
}

/* ── the body ───────────────────────────────────────────────────────────────
   Joints live in grid pixels. The figure faces RIGHT; lefties are mirrored
   when drawn. "near" is the arm/leg closer to the camera.                    */
const BASE = {
  head:[56,16], neck:[56,27], chest:[56,34], hip:[55,56],
  nSh:[53,30], fSh:[59,30],
  nEl:[50,42], nHa:[52,33], fEl:[56,42], fHa:[55,33],
  nKn:[50,76], nAn:[48,99], fKn:[60,76], fAn:[63,99],
  lean:0, turn:0, batA:null, gloveA:null, ball:null, crouch:0,
};

function buildPlayer(J, look, c1, c2, o = {}){
  const P = palette(look, c1, c2), S = Rig(P);
  const j = { ...BASE, ...J };
  const cr = j.crouch || 0, L = j.lean || 0;
  const T = ([x, y]) => [x + L * (1 - (y - 20) / 80), y + (y > 50 ? 0 : cr)];
  const hip = T(j.hip), chest = T(j.chest), neck = T(j.neck), head = T(j.head);
  const nSh = T(j.nSh), fSh = T(j.fSh);

  // ---- far leg, then near leg, so the near one sits on top -----------------
  const leg = (kn, an, near) => {
    S.begin();
    S.limb(hip, kn, near ? 11 : 10, near ? 8 : 7, ['p1','p1','p2','p3']);
    S.limb(kn, [an[0], an[1] - 3], near ? 8 : 7, near ? 6 : 5, ['p1','p1','p2','p3']);
    // the sock and the shoe
    S.limb([kn[0] + (an[0]-kn[0])*.62, kn[1] + (an[1]-kn[1])*.62], [an[0], an[1]-3], 7, 5.5, ['j1','j1','j2','j3']);
    S.fill('boot', [[an[0]-4, an[1]-4], [an[0]+5, an[1]-4], [an[0]+7, an[1]], [an[0]-4, an[1]]]);
    S.shade('boot2', [[an[0]-4, an[1]-4], [an[0]+5, an[1]-4], [an[0]+5, an[1]-2], [an[0]-4, an[1]-2]]);
    S.end();
  };
  leg(T(j.fKn), T(j.fAn), false);

  // ---- the far arm --------------------------------------------------------
  const arm = (sh, el, ha, near) => {
    S.begin();
    S.limb(sh, el, near ? 9 : 8, near ? 7 : 6, ['j1','j1','j2','j3']);        // sleeve
    S.limb(el, ha, near ? 6.5 : 5.5, near ? 5 : 4.5, ['s2','s2','s3','s4'], true);  // forearm
    S.ell(near ? 's3' : 's2', ha[0], ha[1], 3, 2.6);                           // hand
    S.end();
  };
  arm(fSh, T(j.fEl), T(j.fHa), false);

  // ---- torso --------------------------------------------------------------
  S.begin();
  S.fill('j2', [[nSh[0]-7, nSh[1]-3], [fSh[0]+7, fSh[1]-3], [hip[0]+8, hip[1]], [hip[0]-8, hip[1]]]);
  S.shade('j1', [[hip[0]-8, hip[1]-16], [hip[0]+8, hip[1]-16], [hip[0]+8, hip[1]], [hip[0]-8, hip[1]]]);   // under the ribs
  S.shade('j3', [[nSh[0]-7, nSh[1]-3], [fSh[0]+7, fSh[1]-3], [fSh[0]+6, fSh[1]+4], [nSh[0]-6, nSh[1]+4]]); // lit shoulders
  S.shade('j1', [[nSh[0]-7, nSh[1]-1], [nSh[0]-3, nSh[1]-2], [hip[0]-5, hip[1]], [hip[0]-8, hip[1]]]);     // shadow down the back
  // belt
  S.fill('boot', [[hip[0]-8, hip[1]-4], [hip[0]+8, hip[1]-4], [hip[0]+8, hip[1]], [hip[0]-8, hip[1]]]);
  S.dot('j4', hip[0]-1, hip[1]-3, 3, 3);
  if (o.front){
    S.dot('j1', hip[0], hip[1]-20, 1, 16);                                      // the button placket down the front
    S.dot('j3', hip[0]-1, hip[1]-20, 1, 16);
  }
  if (o.number != null && !o.front){                                            // the number across his back
    const dig = String(o.number).split('');
    dig.forEach((d, i) => {
      const x0 = hip[0] - (dig.length * 5) / 2 + i * 5, y0 = hip[1] - 17;
      NUM[d].forEach(([dx, dy, w, h]) => S.dot('white', x0 + dx, y0 + dy, w || 1, h || 1));
    });
  }
  S.end();

  // ---- head, cap, hair ----------------------------------------------------
  S.begin();
  S.limb(neck, [neck[0], neck[1]-4], 7, 7, ['s1','s1','s2','s3']);              // neck
  S.ell('s4', head[0], head[1], 8, 8.5);
  S.shadeE('s3', head[0]-3, head[1]+1, 5, 7);                                   // the far side of the face
  S.shadeE('s2', head[0]-6, head[1]+3, 3, 5);
  S.shadeE('s5', head[0]+4, head[1]-3, 3.5, 3.5);                               // light on the cheekbone
  S.shade('s2', [[head[0]-8, head[1]+5], [head[0]+8, head[1]+5], [head[0]+8, head[1]+9], [head[0]-8, head[1]+9]]);  // jaw shadow
  if (look.beard){
    S.shade('r1', [[head[0]-6, head[1]+2], [head[0]+8, head[1]+1], [head[0]+8, head[1]+9], [head[0]-5, head[1]+8]]);
  }
  if (o.front){
    // seen head on: two eyes, a nose down the middle, the brim across the brow
    S.shadeE('s3', head[0], head[1]+4, 7, 4);
    S.dot('eye', head[0]-4, head[1]-1, 3, 2); S.dot('iris', head[0]-3, head[1]-1, 1, 2);
    S.dot('eye', head[0]+2, head[1]-1, 3, 2); S.dot('iris', head[0]+3, head[1]-1, 1, 2);
    S.dot('s1', head[0]-5, head[1]-3, 4, 1); S.dot('s1', head[0]+2, head[1]-3, 4, 1);
    S.dot('s3', head[0], head[1]+1, 1, 3);                                      // nose
    S.dot('s2', head[0]-2, head[1]+5, 5, 1);                                    // mouth
    S.shade('r2', [[head[0]-9, head[1]-5], [head[0]+9, head[1]-5], [head[0]+9, head[1]-1], [head[0]-9, head[1]-1]]);
    S.fill('j2', [[head[0]-9, head[1]-3], [head[0]-6, head[1]-10], [head[0]+6, head[1]-10], [head[0]+9, head[1]-3]]);
    S.shade('j3', [[head[0]-5, head[1]-10], [head[0]+4, head[1]-10], [head[0]+5, head[1]-6], [head[0]-5, head[1]-6]]);
    S.fill('j1', [[head[0]-10, head[1]-4], [head[0]+10, head[1]-4], [head[0]+9, head[1]-1], [head[0]-9, head[1]-1]]); // brim
    S.dot('j4', head[0]-1, head[1]-8, 2, 2);
  } else {
    // in profile: one eye, the ear, and the brim pointing the way he looks
    S.dot('s2', head[0]-2, head[1], 2, 3);
    S.dot('eye', head[0]+4, head[1]-1, 3, 2); S.dot('iris', head[0]+5, head[1]-1, 1, 2);

const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

/* The swing, as one value:

   .58 contact;  .58 → 1 the follow through.                                   */
function batterPose(t, idle){

    const b = Math.sin(idle / 15), w = Math.sin(idle / 9);
    return { crouch: 3 + b * .5, lean: -1,
      hip:[54,56], chest:[55,34], neck:[55,27], head:[56,16],
      nSh:[50,31], fSh:[59,30],
      nEl:[46,39 + b], nHa:[44,27 + b * .6], fEl:[49,41 + b], fHa:[46,29 + b * .6],
      nKn:[48,76], nAn:[45,99], fKn:[62,75], fAn:[66,99],

  // four beats: stance -> load back -> stride and fire -> wrap it up
  const ld = ease(seg(t, 0, .22)), sw = ease(seg(t, .22, .58)), fo = ease(seg(t, .58, 1));
  const K = (a, b, c, d) => lerp(lerp(lerp(a, b, ld), c, sw), d, fo);
  const J = (a, b, c, d) => [K(a[0], b[0], c[0], d[0]), K(a[1], b[1], c[1], d[1])];
  // the hands load back, then fire out in front, then wrap around his shoulder
  const hands = J([44,27], [41,24], [73,36], [76,20]);
  // the bat goes back past his head, whips all the way through, and finishes behind him
  const batA = K(-103, -126, 6, 128);
  const hipX = K(54, 52, 58, 59);                              // weight shifts back, then drives forward
  const open = K(0, -1, 7, 9);                                 // how far the shoulders have turned
  return {

    hip:[hipX, 56], chest:[hipX + 1, 34], neck:[hipX + 1, 27], head:[56, K(16, 16, 15, 14)],
    nSh:[50 + open, 31], fSh:[59 + open * .5, 30],

    fEl:[K(49,47,64,62), K(41,39,44,36)], fHa:[hands[0] - 3, hands[1] + 3],

    nKn:[K(48, 47, 53, 55), K(76, 77, 78, 80)], nAn:[K(45, 44, 48, 50), K(99, 99, 97, 96)],

function pitcherPose(u){

  const e = ease(lift), s = ease(stride), f = ease(fol);

const TU = 240 / 492;

        if (pts[i].x <= x && pts[i + 1].x >= x){ lo = pts[i]; hi = pts[i + 1]; break; }
      const k = hi.x === lo.x ? 0 : (x - lo.x) / (hi.x - lo.x);
      baseY[x] = lerp(lo.y, hi.y, clamp(k, 0, 1));
      topY[x] = baseY[x] - lerp(lo.h, hi.h, clamp(k, 0, 1));
    }
  }
  let minTop = 1e9;
  for (let x = 0; x <= W; x++) minTop = Math.min(minTop, topY[x]);

  // ── sky ─────────────────────────────────────────────────────────────────
  for (let i = 0; i < minTop; i++){
    const f = i / Math.max(1, minTop);
    R(0, i, W, 1, night ? `rgb(${6 + f * 13 | 0},${10 + f * 20 | 0},${26 + f * 26 | 0})`
                        : `rgb(${92 + f * 80 | 0},${150 + f * 66 | 0},${210 + f * 30 | 0})`);
  }
  if (night) for (let i = 0; i < 30; i++)
    R((i * 61 + 7) % W, (i * 11) % Math.max(4, minTop - 6), 1, 1, '#2c3a60');
  else for (let i = 0; i < 4; i++){
    const cx = (i * 113 + 50) % W, cy = 8 + (i * 9) % 14;
    for (let j = 0; j < 4; j++) R(cx + j * 7 - 10, cy + (j % 2), 12, 4, '#ffffff26');
  }
  // a city skyline on the horizon
  {
    const sky = Math.max(0, Math.floor(minTop) - 32);   // the horizon, just above the stands
    for (let i = 0; i < 26; i++){
      const bx = (i * 37 + 11) % (W + 40) - 20;
      const bw2 = 10 + (i * 7) % 18, bh2 = 10 + (i * 13) % 26;
      const c = night ? '#141b2c' : '#6c7890';
      R(bx, sky - bh2, bw2, bh2, c);
      R(bx, sky - bh2, bw2, 1, night ? '#1d2740' : '#8793a8');
      for (let wy2 = sky - bh2 + 3; wy2 < sky - 2; wy2 += 4)
        for (let wx = bx + 2; wx < bx + bw2 - 2; wx += 4)
          if ((wx + wy2) % 7 < 3) R(wx, wy2, 2, 2, night ? '#ffd98a' : '#9aa6bd');
    }
  }
  [W * .17, W * .83].forEach(x => {                       // light towers over the stands
    R(x - 1, minTop - 20, 2, 20, night ? '#2a3040' : '#5a6472');
    R(x - 10, minTop - 26, 21, 6, night ? '#1d2330' : '#4c5663');
    for (let i = 0; i < 5; i++) R(x - 8 + i * 4, minTop - 25, 3, 3, night ? '#fff6c8' : '#aeb7c4');
    if (night) R(x - 12, minTop - 27, 25, 8, '#fff6c822');
  });

  // ── the stands, filled column by column down to the top of the wall ─────
  const standTop = Math.max(0, Math.floor(minTop) - 30);
  for (let x = 0; x <= W; x++){
    const top = topY[x];
    for (let y = standTop; y < top; y++){
      const f = (y - standTop) / Math.max(1, top - standTop);
      const row = Math.min(5, Math.floor(f * 6)), dim = .12 + row * .11;
      const b = night ? [19, 22, 32] : [74, 80, 95];
      R(x, y, 1, 1, `rgb(${b[0] * (1 - dim * .5) | 0},${b[1] * (1 - dim * .5) | 0},${b[2] * (1 - dim * .5) | 0})`);
      if (row === 2 && y % 3 === 0) R(x, y, 1, 1, night ? '#2a3348' : '#9aa3b4');   // the rail between decks
    }
  }

  // the people: a loose grid of little heads and shoulders
  for (let x = 1; x < W; x += 3){
    const top = topY[x];
    for (let y = standTop + 1; y < top - 1; y += 3){
      if (((x / 3 | 0) % 14) === 0) continue;                       // leave the aisles empty
      const f = (y - standTop) / Math.max(1, top - standTop);
      const c = CROWD[Math.abs((x * 7 + Math.round(y) * 13)) % CROWD.length];
      const lit = night ? mix(c, '#141a28', .50) : mix(c, '#20273a', .18 + f * .26);
      const bob = park.excite > 0 && Math.sin(t / 70 + x * .7) > .3 ? 1 : 0;
      R(x, y - bob, 2, 2, lit);
      R(x, y + 2 - bob, 2, 1, night ? '#0e1220' : mix(c, '#000000', .62));
    }
  }

  // ── the wall ────────────────────────────────────────────────────────────
  for (let x = 0; x <= W; x++){
    const top = topY[x], bot = baseY[x];
    R(x, top, 1, Math.max(1, bot - top), park.wall);
    R(x, top, 1, 2, shade(park.wall, .3));
    R(x, bot - 2, 1, 2, shade(park.wall, -.34));
    if (park.pad && x % 26 < 1) R(x, top + 3, 1, Math.max(1, bot - top - 5), shade(park.wall, -.2));
    if (park.feature === 'ivy' && x % 3 !== 2)
      for (let y = top + 2; y < bot - 1; y += 2) R(x, y, 1, 2, mix('#1f5a2a', '#000000', (x % 9) / 24));
  }
  const mark = (ang, n) => {
    const p = atAng(ang, wallDist(ang)), d = String(n).split('');
    const cx = clamp(p.x | 0, 0, W);
    const x0 = Math.round(p.x - d.length * 2.5), y0 = Math.round((topY[cx] + baseY[cx]) / 2 - 3);
    d.forEach((c, i) => NUM[c].forEach(([dx, dy, w2, h2]) => R(x0 + i * 5 + dx, y0 + dy, w2 || 1, h2 || 1, '#e8e4d6')));
  };
  mark(-38, park.lf); mark(-12, park.cf); mark(38, park.rf);
  if (park.feature === 'scoreboard'){
    const p = atAng(16, wallDist(16)), bw = 78, bh = 30, cx = clamp(p.x | 0, 0, W);
    const bx = Math.round(p.x - bw / 2), by = Math.round(topY[cx] - bh);
    R(bx, by, bw, bh, '#0d1119'); R(bx + 2, by + 2, bw - 4, bh - 4, night ? '#121a2c' : '#1b2436');
    for (let i = 0; i < 7; i++) for (let j = 0; j < 3; j++)
      R(bx + 5 + i * 10, by + 5 + j * 8, 7, 6, ((i * 3 + j) % 4) ? (night ? '#1d2740' : '#263048') : (night ? '#ffcf4a' : '#d8b24a'));
  }
  if (park.feature === 'waterfall'){
    const p = atAng(24, wallDist(24)), cx = clamp(p.x | 0, 0, W);
    const bx = Math.round(p.x), by = Math.round(topY[cx]);
    for (let i = 0; i < 6; i++) R(bx - 22 + i * 8, by - 15, 6, 17 + (i % 3) * 4, mix('#5fc8e8', '#ffffff', (i % 2) * .3));
    R(bx - 24, by - 3, 48, 4, '#8fe3ff');
  }

  // ── warning track and grass, from the foot of the wall down ─────────────
  for (let x = 0; x <= W; x++){
    const bot = Math.round(baseY[x]);
    for (let i = 0; i < 5; i++) R(x, bot + i, 1, 1, i < 4 ? '#8f6240' : '#7d5435');
    for (let y = bot + 5; y < H; y++){
      const f = (y - bot) / Math.max(1, H - bot);
      R(x, y, 1, 1, ((y / 8) | 0) % 2 ? `rgb(${32 + f * 24 | 0},${94 + f * 42 | 0},${38 + f * 18 | 0})`
                                      : `rgb(${38 + f * 27 | 0},${108 + f * 46 | 0},${44 + f * 21 | 0})`);
    }
  }

  // ── the infield ─────────────────────────────────────────────────────────
  const HP = proj(0, 0);
  g.fillStyle = '#b07a4e'; g.beginPath(); g.moveTo(HP.x, HP.y + 12);
  for (let a = -48; a <= 48; a += 2){ const q = atAng(a, 97); g.lineTo(q.x, q.y); }
  g.closePath(); g.fill();
  g.fillStyle = '#bd855a'; g.beginPath(); g.moveTo(HP.x, HP.y + 12);
  for (let a = -48; a <= 48; a += 2){ const q = atAng(a, 72); g.lineTo(q.x, q.y); }
  g.closePath(); g.fill();
  const B1 = atAng(45, 90), B2 = atAng(0, 127), B3 = atAng(-45, 90);
  g.fillStyle = '#3aa44c'; g.beginPath();
  g.moveTo(HP.x, HP.y + 4); g.lineTo(B1.x, B1.y); g.lineTo(B2.x, B2.y); g.lineTo(B3.x, B3.y);
  g.closePath(); g.fill();
  const path = (A, B) => { g.strokeStyle = '#b07a4e'; g.lineWidth = Math.max(2, 6 * A.s);
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke(); };
  path(HP, B1); path(B1, B2); path(B2, B3); path(B3, HP);
  // the dirt around home plate
  g.fillStyle = '#bd855a'; g.beginPath(); g.ellipse(HP.x, HP.y + 3, 58, 21, 0, 0, 7); g.fill();
  g.fillStyle = '#b07a4e'; g.beginPath(); g.ellipse(HP.x, HP.y + 10, 58, 15, 0, 0, 7); g.fill();

  const M0 = proj(60.5, 0), mr = Math.max(9, 18 * M0.s * PK / 2);
  g.fillStyle = '#bd855a'; g.beginPath(); g.ellipse(M0.x, M0.y + 2, mr, mr * .40, 0, 0, 7); g.fill();
  g.fillStyle = '#a97245'; g.beginPath(); g.ellipse(M0.x, M0.y + mr * .22, mr, mr * .3, 0, 0, 7); g.fill();
  R(Math.round(M0.x - 4), Math.round(M0.y - 2), 8, 2, '#eee8dd');

  g.strokeStyle = '#f2efe6'; g.lineWidth = 1;
  [-45, 45].forEach(a => { const far = atAng(a, wallDist(a));
    g.beginPath(); g.moveTo(HP.x, HP.y + 4); g.lineTo(far.x, far.y); g.stroke(); });
  [B1, B2, B3].forEach(bs => { const s2 = Math.max(3, 8 * bs.s);
    R(bs.x - s2 / 2, bs.y - s2 / 3, s2, s2 * .6, '#f4f1e8');
    R(bs.x - s2 / 2, bs.y + s2 * .27 - s2 / 3, s2, 1, '#c9c4b4'); });

  g.strokeStyle = '#a97245'; g.lineWidth = 1;
  g.beginPath(); g.ellipse(HP.x, HP.y + 3, 56, 20, 0, Math.PI, 0); g.stroke();
  g.strokeStyle = '#ffffff44';
  g.strokeRect(HP.x - 42.5, HP.y - 9.5, 26, 24); g.strokeRect(HP.x + 16.5, HP.y - 9.5, 26, 24);
  g.fillStyle = '#f4f1e8'; g.beginPath();
  g.moveTo(HP.x - 10, HP.y - 1); g.lineTo(HP.x + 10, HP.y - 1);
  g.lineTo(HP.x + 10, HP.y + 3); g.lineTo(HP.x, HP.y + 7); g.lineTo(HP.x - 10, HP.y + 3);
  g.closePath(); g.fill();
}

let WARMED = '';

  try {

    for (const c of cols){
      for (let i = 0; i < 8; i++){
        if (GPR.ready) for (const d of ['side', 'front', 'back']) tasks.push(() => { gpTint(GPR[d][i], 'RN' + d + i, c); gpRunHead(d, i); });

function makePark(team){
  const kinds = [
    { wall:'#1c3b40', wallH:26, feature:'ivy',        pad:0, lf:300, cf:400, rf:330 },
    { wall:'#1c6e4a', wallH:34, feature:'none',       pad:1, lf:310, cf:390, rf:302 },   // tall left wall
    { wall:'#17324f', wallH:20, feature:'scoreboard', pad:1, lf:330, cf:410, rf:318 },
    { wall:'#2a4a6a', wallH:22, feature:'waterfall',  pad:1, lf:322, cf:404, rf:322 },
    { wall:'#3a2a2a', wallH:18, feature:'none',       pad:1, lf:295, cf:396, rf:314 },   // short porch
  ];
  const k = kinds[Math.abs(team.ab.charCodeAt(0) + team.ab.charCodeAt(1)) % kinds.length];
  return { ...k, night: (team.ab.charCodeAt(0) % 2) === 0, excite:0 };
}

// What a colour "is" for this rule: blue, navy and royal blue are all BLUE; red and maroon are RED, and so on. Two clubs may never wear the same family.
function colorFamily(hex){
  const [r, g, b] = hexRgb(hex).map(v => v / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (d < .1) return l > .78 ? 'white' : l < .3 ? 'black' : 'grey';                       // white and silver are one family, black and charcoal another
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360;
  if (h < 14 || h >= 334) return 'red';
  if (h < 42) return l < .24 ? 'brown' : 'orange';
  if (h < 70) return 'yellow';
  if (h < 170) return 'green';
  if (h < 200) return 'teal';
  if (h < 268) return 'blue';
  if (h < 330) return 'purple';
  return 'pink';
}
// home: main colour, always. away: main colour if it is a different kind of colour, else its second, else plain white or grey road colours.
function pickUniforms(home, away){
  const hf = colorFamily(home.c1);
  const opts = [[away.c1, away.c2], [away.c2, away.c1], ['#ffffff', away.c1], ['#c4ced4', away.c1], ['#27251f', away.c1]];
  const pick = opts.find(o => colorFamily(o[0]) !== hf) || opts[2];
  // the trim colour (cap brim, sleeves): home's second colour, kept different from its main one
  const trim = t => colorFamily(t.c2) !== colorFamily(t.c1) ? t.c2 : '#ffffff';
  return { home: home.c1, away: pick[0], homeTrim: trim(home), awayTrim: pick[0] === away.c1 ? trim(away) : away.c1 };
}
const uni = t => (M && M.uni) ? (t === M.home ? M.uni.home : M.uni.away) : t.c1;
const uni2 = t => (M && M.uni) ? (t === M.home ? M.uni.homeTrim : M.uni.awayTrim) : t.c2;

const userBats = () => weBat() && (M.mode === 'full' || M.mode === 'offense');
const userPitches = () => !weBat() && (M.mode === 'full' || M.mode === 'defense');

// what each pitcher has done in this game: pitches, runs, outs, and whether he has been in (a pitcher taken out cannot come back)
const PG = new Map();
const pg = p => PG.get(p) || (PG.set(p, { pc:0, sp:(p.stam != null && p.stam < 1 ? (1 - p.stam) * stamCap(p) : 0), r:0, po:0, used:false, nT:0, nS:0, nB:0, nC:0 }), PG.get(p));       // pc = pitches thrown, sp = stamina spent; nT/nS/nB/nC = what the batters have seen from him this game
const spOf = g => g.sp != null ? g.sp : g.pc;
const stamCap = p => { const t = (clamp(p.stamina, 60, 120) - 60) / 60; return p.pos === 'CP' ? lerp(25, 35, t) : p.pos === 'RP' ? lerp(40, 60, t) : lerp(50, 85, t); };      // pitches he has in him at STA 60 to 120: a starter 50-85, a reliever 40-60, a closer 25-35
// how much is left in the tank (0-1): in a game it is what he has left right now; outside one it is what he carries into the next game
const stamPct = (p, live) => live ? 1 - clamp(spOf(pg(p)) / stamCap(p), 0, 1) : (p.stam == null ? 1 : p.stam);
const stamHue = pct => 120 * clamp(pct, 0, 1);                                      // green > greenish yellow > yellow > orange > red, smoothly
function stamBar(x, y, w, h, pct){ R(x, y, w, h, '#0a0d16'); R(x, y, Math.max(0, Math.round(w * clamp(pct, 0, 1))), h, `hsl(${stamHue(pct).toFixed(0)},88%,50%)`); R(x, y, w, 1, 'rgba(255,255,255,.22)'); }
// what he gets back between games: a starter 20%, a reliever 25%, a closer 40% (a pitcher who is not used rests the same)
const restRate = p => p.pos === 'CP' ? .40 : p.pos === 'RP' ? .25 : .20;
function restPitchers(){ G.cards.filter(isPitcher).forEach(p => { const g = PG.get(p), left = g && g.used ? 1 - clamp(spOf(g) / stamCap(p), 0, 1) : stamPct(p, false); p.stam = clamp(left + restRate(p), 0, 1); }); }

const inZone = () => { const r = ballAt(1).r; return Math.abs(P.tx) <= 1 + r / (ZONE.w / 2) && Math.abs(P.ty) <= 1 + r / (ZONE.h / 2); };

// ── swinging: the input only SCHEDULES the swing ───────────────────────────
const LATEST_SWING = 300;                        // the bat cannot arrive later than this past the plate
function doSwing(){
  if (!P || !P.thrown || P.state !== 'flight' || swing || P.result) return false;
  swing = { start: P.t, contactAt: Math.min(P.t + BAT_LAG, P.dur + LATEST_SWING),
            t:0, resolved:false, cpu:false };
  return true;
}
// what the computer's batter decides to do with this pitch
function cpuDecide(){
  const b = M.batter, g0 = pg(curPitcher());
  const con = clamp((b.contact - 60) / 60, 0, 1);
  const eye = clamp((b.contact * .6 + b.power * .4 - 60) / 60, 0, 1);
  // He judges the pitch from the first half of its flight and assumes it keeps going straight. A fastball is what it looks like (and is read more exactly);
  // a curve or slider looks like it ends somewhere else than it does: higher or wider, so it looks like a strike and then drops off.
  const blur = lerp(.62, .16, eye) * (P.type === 'FB' ? .75 : 1);
  const projX = P.tx - CFG.READ_BREAK * P.br[0] / 11, projY = P.ty - CFG.READ_BREAK * P.br[1] / 14;                // break is in the zone's own units (22 x 28), so half of it is 11 and 14
  const seenX = projX + (bell() - .5) * 2 * blur, seenY = projY + (bell() - .5) * 2 * blur;
  const looksStrike = Math.abs(seenX) <= 1 && Math.abs(seenY) <= 1;
  const close = Math.abs(seenX) <= 1.45 && Math.abs(seenY) <= 1.45;
  // how eager he is, by count
  let want = looksStrike ? .74 : close ? .26 : .06;
  if (M.strikes === 2) want = looksStrike ? .93 : close ? .72 : .22;     // protect the plate
  if (M.balls === 3 && M.strikes < 2) want *= .62;                        // take the walk
  want *= lerp(.82, 1.12, clamp((b.power - 60) / 60, 0, 1));              // sluggers hack more
  // what he has seen from this pitcher today: mostly strikes and they swing more (15% when strikes lead by one, 30% by two or more); mostly balls and they swing less, the same way
  if ((g0.nT || 0) >= 6){ const d = (g0.nS || 0) - (g0.nB || 0), mag = Math.abs(d) >= 2 ? .30 : Math.abs(d) === 1 ? .15 : 0; want *= 1 + Math.sign(d) * mag; }
  // and if most of them have been on the corners, they go after what is headed for a corner (up to 30% more)
  if ((g0.nT || 0) >= 10 && Math.abs(seenX) >= .5 && Math.abs(seenY) >= .5 && Math.abs(seenX) <= 1.25 && Math.abs(seenY) <= 1.25) want *= 1 + clamp(((g0.nC || 0) / g0.nT - .35) / .35, 0, 1) * .30;
  if (!chance(clamp(want, .02, .97))) return;                             // he takes it
  // his timing is off by an amount that shrinks as contact goes up.
  // gauss() has real tails, so sometimes he is badly fooled.
  const err = gauss() * lerp(150, 62, con) - (P.type === 'FB' ? 0 : 14);
  const at = clamp(P.dur + err, 60, P.dur + LATEST_SWING);
  swing = { start: Math.max(0, at - BAT_LAG), contactAt: at, t:0, resolved:false, cpu:true };
}

/* The bat against the ball.
   Two things have to line up: WHEN the bat arrives, and WHERE it sweeps.
   A swing and a hit are different events — this is what decides between them. */
function resolveSwing(){
  const b = M.batter;
  const con = clamp((b.contact - 60) / 60, 0, 1);
  // timing, in milliseconds either side of the ball crossing the plate
  const dErr = swing.contactAt - P.dur;                 // < 0 early, > 0 late
  const speedF = 1 - .01 * Math.max(0, (P.mph || 0) - 75);                               // a pitch faster than 75 mph narrows the window 1% for every mph over (100 mph = 25% narrower)
  const win = lerp(76, 128, con) * (M.derby ? 2 : 1) * speedF;                                   // you and the computer get the same window (76 ms at 60 contact to 128 ms at 120); in the derby it is twice as wide
  const tN = Math.abs(dErr) / win;

  // where the bat sweeps. He commits to a plane off his read of the pitch;
  // better hitters read it better, so they cover more of the zone.
  const read = lerp(.34, .90, con);
  const plane = P.ty * read + gauss() * (1 - read) * .62;
  const batH = lerp(.46, .90, con);                     // how much height the barrel covers
  const reach = lerp(1.02, 1.34, con);                  // how far off the plate he can get to it
  const sN = outsideIn(P.tx, P.ty) > reachIn(b.contact) + .001 ? 2 : 0;       // he cannot get the barrel to a pitch further out of the zone than his contact reaches

  swing.dErr = dErr; swing.tN = tN; swing.sN = sN; swing.plane = plane;
  if (tN > 1.5 || sN > 1){ P.result = 'swingmiss'; return; }      // the bat goes through empty air
  // a glancing blow: edge of the window, or the barrel only clips it
  const edge = Math.max(tN, sN * .92);
  if (edge > .74 || chance(.07)){ P.result = 'foul'; foulBall(dErr, edge); return; }
  P.result = 'hit';
  makeContact(clamp(1 - edge, 0, 1), dErr);
}

// a foul: it is a real batted ball, it just goes out of play
function foulBall(dErr, edge){
  const b = M.batter;
  const pullSide = (b.bats === 'L' ? -1 : 1);
  const side = dErr < 0 ? -pullSide : pullSide;                   // early = pulled foul, late = back the other way
  const sa = side * rnd(72, 47);
  launchBall(lerp(52, 86, 1 - edge), rnd(58, 14), sa, .3);
  BALL.foul = true; BALL.tJudge = Math.min(BALL.T, 2.5); BALL.tEnd = BALL.tJudge + .6;
  P.state = 'inplay'; P.playT = 0;
  if (!M.derby) planFielders();
}

// solid contact: this is where timing, location, the hitter and a little luck meet
const HR_ANGLE = 27.5;                                       // the perfect home run launch angle, degrees
const EVMAX = [98, 108, 112, 116, 120, 124, 132];                  // fastest ball (mph) at power 60, 70, ... 120: flatter, so even a 70 can reach the seats (about 108 mph clears the wall to dead centre, 96 down the lines)
const evMin = p => 50 + (p - 60) * .3;                          // mph: slowest ball a hitter of this power can hit (50 at power 60 up to 68 at 120)
const evMax = p => { const x = clamp((p - 60) / 10, 0, 6), i = Math.min(5, Math.floor(x)); return lerp(EVMAX[i], EVMAX[i + 1], x - i); };   // and the fastest
function makeContact(qual, dErr){
  const b = M.batter;
  // early swings pull the ball, late swings go the other way
  const pull = clamp(-dErr / 140, -1, 1) * (b.bats === 'L' ? -1 : 1);
  const sa = clamp(pull * 28 + (bell() - .5) * 70, -62, 62);        // beyond 45 degrees it is a foul
  // Launch angle, all dice. Every swing rolls one of three things:
  //  - the sweet angle (25-30 degrees, the home run angle): better timing and better contact make it more likely,
  //  - a grounder (0-8 degrees): better contact is also more likely to hit one, and mis-timed good contact tops it into the ground,
  //  - otherwise a scattered angle, flat or high: the worse the hitter and the timing, the wider the scatter (line-drive outs and pop flies).
  const tq = clamp((qual - .26) / .74, 0, 1), cn = clamp((b.contact - 60) / 60, 0, 1);              // timing 0..1 (1 = perfect) and contact 0..1
  const skill = Math.pow(tq, 1.2) * (.55 + .45 * cn);
  const mid = userPitches() && Math.abs(P.tx) <= 2 / IN_X && Math.abs(P.ty) <= 2 / IN_Y;        // a pitch right down the middle (4 x 4 inches) is easier to drive
  const pSweet = lerp(.03, .30, Math.pow(skill, 1.1));
  const pGround = clamp(.08 + .12 * cn + (1 - tq) * cn * .22, 0, .6);
  const dice = Math.random();
  let la;
  if (dice < pSweet) la = rnd(30, 25);
  else if (dice < pSweet + pGround) la = rnd(8, -6);
  else la = 13 + gauss() * lerp(26, 13, skill);
  la = clamp(la, -25, 62);
  const roll = bell() * .55 + Math.random() * .45;
  // Exit speed runs between the slowest and the fastest ball his power can make: 60 power = 40-81 mph, 70 = 45-90, ... 120 = 70-133.
  // Where in that range depends on the swing: how well it was timed and met (qual) plus a roll of the dice.
  const t = clamp((qual - .26) / .74 * .6 + roll * .3 + .1, 0, 1);
  let ev = lerp(evMin(b.power), evMax(b.power), t);
  if (mid && chance(CFG.MID_BARREL)){ la = rnd(30, 25); ev = Math.max(ev, lerp(evMin(b.power), evMax(b.power), .9)); }          // a mistake down the middle sometimes gets barrelled
  launchBall(ev, la, sa, qual);
  P.state = 'inplay'; P.playT = 0;
  if (!M.derby) planFielders();
}

// ── the defence ────────────────────────────────────────────────────────────
// Every fielder reacts, accelerates, and runs for the first point on the ball's path he can reach in time.
let FLD = null;
const fldDist = (acc, v, tau) => tau <= 0 ? 0 : tau < acc ? .5 * v / acc * tau * tau : .5 * v * acc + v * (tau - acc);
const fldReach = (f, D) => (D /= CFG.ROUTE_EFF, f.react) + (D <= .5 * f.speed * CFG.FIELDER_ACCEL_T ? Math.sqrt(2 * D * CFG.FIELDER_ACCEL_T / f.speed) : CFG.FIELDER_ACCEL_T + (D - .5 * f.speed * CFG.FIELDER_ACCEL_T) / f.speed);
function planFielders(){
  const B = BALL, ft = fldTeam();
  const last = B.path[B.path.length - 1], tEnd = (B.path.length - 1) / 120;
  FLD = FIELDERS.map(([d, lat, pos], i) => {
    const man = posMan(ft, pos);
    const fld = clamp((man.fielding - 60) / 60, 0, 1);
    return { i, man, pos, d, lat, x:d, y:lat, speed: sprintFps(spdOf(man)), react: lerp(CFG.REACT_SLOW, CFG.REACT_FAST, fld), fld,
             armFps: throwFps(man.fielding), arm: CFG.ARM_BASE + (man.fielding - 60) * CFG.ARM_SLOPE,
             need: 99, gap: 0, chasing: false, t0: 0, tx: d, ty: lat, ex: d, ey: lat };
  });
  const land = ballPos(B, B.T); B.land = land;
  FLD.forEach(f => { f.gap = Math.hypot(land.d - f.d, land.lat - f.lat); });
  if (B.hr){ B.chaser = null; B.play = 'hr'; B.tJudge = Math.min(B.T, hrGoneTime(B) + .05); B.tEnd = B.tJudge + 3.6; B.runN = 4; return; }
  // the earliest moment each man can be within reach of the ball while it is low enough to catch
  FLD.forEach(f => {
    let hit = null;
    for (let k = 0; k < B.path.length; k += 2){
      const p = B.path[k], t = k / 120; if (p[2] > CFG.CATCH_H) continue;
      const D = Math.hypot(p[1] - f.d, p[0] - f.lat);
      // In the air he has to be right under it (2 ft). The long dive reach is only for a ball that has landed and is rolling:
      // before, a fly ball dropping below 2.5 ft counted as "on the ground" and was caught from 11 ft away.
      const air = t < B.T;
      if (air && p[2] < CFG.CATCH_MIN_H) continue;         // under a foot it is already a ground ball, not a catch
      const infield = f.d < 150;
      // in the air he must be right under it (2 ft); only an infielder gets a lunge at a low liner, and the long dive is for a landed, rolling ball in the infield
      const Rr = air ? (p[2] < 2.5 && infield ? CFG.INFIELD_DIVE : CFG.CATCH_RADIUS) : (p[2] < 2.5 && infield ? CFG.DIVE_REACH : CFG.CATCH_RADIUS);
      if (fldReach(f, Math.max(0, D - Rr)) + (p[1] > f.d + 8 ? CFG.BACK_PENALTY : 0) <= t){ hit = { t, p, D, R: Rr }; break; }
    }
    if (!hit){ const D = Math.hypot(last[1] - f.d, last[0] - f.lat); hit = { t: Math.max(tEnd, fldReach(f, Math.max(0, D - CFG.CATCH_RADIUS))), p: last, D, R: CFG.CATCH_RADIUS }; }
    f.hit = hit; f.need = hit.t;
  });
  const c = FLD.reduce((a, f) => f.need < a.need ? f : a);
  c.chasing = true; B.chaser = c;
  const D = c.hit.D, run = Math.max(0, D - c.hit.R), u = D > 0 ? run / D : 0;
  c.tx = c.d + (c.hit.p[1] - c.d) * u; c.ty = c.lat + (c.hit.p[0] - c.lat) * u;       // where he ends up: a glove's reach short of the ball
  c.runLen = run;
  B.tf = c.need; B.pf = [c.tx, c.ty];
  planOutcome(B, c);
  planCover(B, c);
}
// ── everybody moves: while one fielder chases the ball, the rest go where they would on a real field ──────────────────
// Ground ball in the infield: 1B to the first-base bag (the throw may come there), 2B to the second-base bag in case the runner
// runs on past first, SS (not fielding it) steps in ready for a short throw; if 2B or 1B fields it, SS covers second.
// Ball in the air or to the outfield: the other outfielders run toward the ball to back it up, SS and 2B go out as the cut-off
// men, 1B and 3B take their bags. Everyone leaves after his own reaction time and runs at his own speed.
const STAND = { 1:[62.4, 62.4], 2:[125.9, 0], 3:[62.4, -62.4] };       // [depth, lat] where a fielder stands on a bag, glove up
function planCover(B, c){
  if (!FLD) return;
  FLD.forEach(f => { f.go = null; f.relay = false; });
  if (B.hr || (B.foul && !B.isCatch)) return;
  const land = B.pf ? { d:B.pf[0], lat:B.pf[1] } : (B.land || { d:c.tx, lat:c.ty });
  const byPos = p => FLD.find(f => f.pos === p);
  const send = (f, x, y, bag) => { if (f && f !== c && !f.go) f.go = { x, y, bag: bag || 0, dist: Math.hypot(x - f.d, y - f.lat) }; };
  const infield = c.d < 150 && !B.isCatch;
  const toward = (f, t, k) => [f.d + (t.d - f.d) * k, f.lat + (t.lat - f.lat) * k];
  const pthr = B.thr || B.autoThr;
  if (pthr && pthr.pivot && B.dpBase >= 2 && B.dpBase <= 3 && pthr.pivot !== c) send(pthr.pivot, STAND[B.dpBase][0], STAND[B.dpBase][1], B.dpBase);       // the man who turns the double play is on his bag
  if (pthr && pthr.catcher){ const bi = [[63.64, 63.64], [127.28, 0], [63.64, -63.64]].findIndex(q => Math.abs(q[0] - pthr.to[0]) < 1 && Math.abs(q[1] - pthr.to[1]) < 1); if (bi >= 0) send(pthr.catcher, STAND[bi + 1][0], STAND[bi + 1][1], bi + 1); }
  if (infield){
    // 1) the throw is going to a bag: the nearest man who is not fielding it covers that bag
    let covering = null;
    if (B.thr){
      const bags = [[63.64, 63.64], [127.28, 0], [63.64, -63.64]];
      const bi = bags.findIndex(q => Math.abs(q[0] - B.thr.to[0]) < 1 && Math.abs(q[1] - B.thr.to[1]) < 1);
      if (bi >= 0){
        const cand = (bi === 0 ? ['1B', '2B'] : bi === 1 ? ['2B', 'SS'] : ['3B', 'SS']).map(byPos).filter(f => f && f !== c);
        cand.sort((a, b) => Math.hypot(a.d - bags[bi][0], a.lat - bags[bi][1]) - Math.hypot(b.d - bags[bi][0], b.lat - bags[bi][1]));
        if (cand[0]){ covering = cand[0]; send(covering, STAND[bi + 1][0], STAND[bi + 1][1], bi + 1); }
      }
    }
    // 2) the standing assignments: the man who fields it, everybody else goes to his own bag
    const first = byPos('1B'), second = byPos('2B'), short = byPos('SS'), third = byPos('3B');
    const bag = (f, n) => send(f, STAND[n][0], STAND[n][1], n);
    if (c === first){ bag(second, 1); bag(short, 2); bag(third, 3); }                            // down the first-base line: 1B fields it (and may run it to the bag), 2B covers first, SS second
    else if (c === second){ bag(first, 1); bag(short, 2); bag(third, 3); }                       // between first and second: 2B fields it, SS to second, 1B to first
    else if (c === short){ bag(first, 1); bag(second, 2); bag(third, 3); }                       // the hole: SS fields it, 2B to second
    else if (c === third){ bag(first, 1); bag(second, 2); if (B.thr && B.thr.stepOn){ const p = toward(short, { d:STAND[2][0], lat:0 }, .5); send(short, p[0], p[1], 0); } else bag(short, 3); }                       // down the third-base line: 3B fields it, SS covers third
    else { bag(first, 1); bag(second, 2); bag(third, 3); if (short){ const p = toward(short, { d:STAND[2][0], lat:0 }, .5); send(short, p[0], p[1], 0); } }
    ['LF', 'CF', 'RF'].forEach(p => { const o = byPos(p); if (o){ const q = toward(o, { d:60, lat:o.lat * .6 }, .22); send(o, q[0], q[1], 0); } });   // outfielders step in to back up
  } else {
    // the ball is in the air or in the outfield
    ['LF', 'CF', 'RF'].forEach(p => { const o = byPos(p); if (o && o !== c){ const q = toward(o, land, .45); send(o, q[0], q[1], 0); } });   // back it up
    const rl = outfieldRoles(land), cutMan = byPos(rl.cutPos), bagMan = byPos(rl.bagPos);
    send(cutMan, rl.cut[0], rl.cut[1], 0);                                                        // the cut-off man at the edge of the infield dirt, lined up with the throw
    send(bagMan, STAND[2][0] - 2, STAND[2][1] + (bagMan === byPos('SS') ? 3 : -2), 2);            // the other takes second
    send(byPos('1B'), STAND[1][0], STAND[1][1], 1);
    send(byPos('3B'), STAND[3][0], STAND[3][1], 3);
  }
  if (pthr && pthr.relays) pthr.relays.forEach(r => { r.f.go = { x:r.spot[0], y:r.spot[1], bag:0, dist:Math.hypot(r.spot[0] - r.f.d, r.spot[1] - r.f.lat) }; r.f.relay = true; });      // a relay man stands where the long throw will find him
}

// who is where right now
function stepFielders(dt){
  if (!FLD || !BALL) return;
  FLD.forEach(f => {
    if (!f.go || f.chasing) return;
    const tau = BALL.t - f.react - .12, s = Math.min(f.go.dist, fldDist(CFG.FIELDER_ACCEL_T, f.speed * .92, tau)), u = f.go.dist > 0 ? s / f.go.dist : 1;
    f.x = lerp(f.d, f.go.x, u); f.y = lerp(f.lat, f.go.y, u); f.moving = u > 0 && u < 1;
  });
  if (BALL.thr && BALL.thr.carry && BALL.thr.carryF && BALL.t >= BALL.thr.t0 && !BALL.hr){ const tp = thrPos(BALL.thr, BALL.t); BALL.thr.carryF.x = tp.d; BALL.thr.carryF.y = tp.lat; BALL.thr.carryF.carrying = true; }
  const c = BALL.chaser; if (!c) return;
  const tau = BALL.t - c.react, s = Math.min(c.runLen, fldDist(CFG.FIELDER_ACCEL_T, c.speed, tau) * CFG.ROUTE_EFF), f = c.runLen > 0 ? s / c.runLen : 1;
  c.x = lerp(c.d, c.tx, f); c.y = lerp(c.lat, c.ty, f);
  if (BALL.thr && BALL.thr.carry && BALL.thr.carryF === c && BALL.t >= BALL.thr.t0 && !BALL.hr){ const tp = thrPos(BALL.thr, BALL.t); c.x = tp.d; c.y = tp.lat; }
}
// the batter and the throw: the whole play, worked out once at contact
function planOutcomeAuto(B, c){
  const b = M.batter, spd = spdOf(b), tf = B.tf, pf = B.pf;
  const inAir = !B.grounder && tf < B.T && c.hit.p[2] >= CFG.CATCH_MIN_H && B.la >= CFG.GROUND_MAX_LA;     // a catch: right under it, at least a foot up
  const bases = [[63.64, 63.64], [127.28, 0], [63.64, -63.64], [0, 0]];
  const baseDist = n => Math.hypot(pf[0] - bases[n - 1][0], pf[1] - bases[n - 1][1]);
  const routes = {}, route = (n, tr) => routes[n + '|' + tr] || (routes[n + '|' + tr] = routeThrow(c, pf, tf, bases[n - 1], tr, false));
  const throwArr = (n, tr) => route(n, tr).arr;
  const throwTo = (n, tr) => { B.thr = mkThr(route(n, tr), pf, bases[n - 1]); };
  B.runN = 1; B.out = false;
  const tagOK = () => { if (userBats() && (B.play === 'flyout' || B.play === 'lineout') && M.outs < 2 && M.bases.some(Boolean)){ B.tagUp = true; B.tEnd = tf + 1.9; } };       // a caught fly, men on and under two out: you may send them
  B.thrInfo = { tf, tr: CFG.TRANSFER_AIR, pf, arm: c.armFps };
  if (B.foul){                                                      // fielders chase foul balls too: caught in the air and in the park, it is an out
    const ang = Math.atan2(B.land.lat, B.land.d) * 180 / Math.PI, inPark = window.GL3D ? Math.hypot(B.land.d, B.land.lat) < GL3D.fenceR(M.park, ang) - 2 : true;
    if (inAir && inPark && B.land.d > -8){ B.foul = false; B.isCatch = true; B.play = 'flyout'; B.tJudge = tf; B.tEnd = tf + 1.0; B.runN = 0; tagOK(); }
    else { B.play = 'foul'; B.tJudge = Math.min(B.T, 2.5); B.tEnd = B.tJudge + .6; }
    return;
  }
  if (inAir){
    B.isCatch = true; B.play = B.la > CFG.LINE_MAX_LA ? 'flyout' : 'lineout'; B.tJudge = tf; B.tEnd = tf + 1.0; B.runN = 0; tagOK();
    if (!userBats() && B.play === 'flyout' && M.outs < 2 && M.bases[2]){
      B.sacFly = true;
      const len = Math.hypot(pf[0], pf[1]);
      if (len <= throwRange(c.man.fielding)){                                  // he can reach the plate from here: he throws, and the runner is out if the ball beats him
        const t0 = tf + CFG.TRANSFER_AIR + len * CFG.GLOVE_PER_FT, t1 = t0 + len / c.armFps, runner = tf + runTime(spdOf(M.bases[2]), 90);
        B.thr = mkThr({ legs:[{ from:pf, to:bases[3], t0, t1, len }], arr:t1, relays:[] }, pf, bases[3]); B.thr.catcher = null;
        B.sacOut = t1 < runner; B.tEnd = Math.max(t1, runner) + .8;
      }
    }
    return;
  }
  const tr = CFG.TRANSFER_GROUND;                                    // fielded off the ground
  B.thrInfo = { tf, tr, pf, arm: c.armFps };                          // when and from where the throw can go: judges every extra-base try
  if (B.hr){ B.play = 'hr'; B.tJudge = Math.min(B.T, hrGoneTime(B) + .05); B.tEnd = B.tJudge + 3.6; B.runN = 4; return; }
  B.tJudge = tf;

// a pixel-art baseball: dark rim, lit top-left, shaded bottom-right, two red seams
// our own spinning pixel baseball (tools/make_ball.py): 8 frames per size in assets/ball/spinN.png, the nearest size is chosen and never scaled
const BALL_SIZES = [3, 4, 5, 6, 7, 8, 10, 12, 16, 20, 24], BALLPX = {};
BALL_SIZES.forEach(n => { const im = new Image(); im.onload = () => { im._ok = true; }; im.onerror = () => {}; im.src = `assets/ball/spin${n}.png?b=3`; BALLPX[n] = im; });
function ballPx(x, y, dia){
  const n = BALL_SIZES.find(v => v >= dia) || 24, im = BALLPX[n];
  if (!im || !im._ok) return false;
  g.imageSmoothingEnabled = false; g.drawImage(im, (Math.floor(frame / 2) % 8) * n, 0, n, n, Math.round(x - n / 2), Math.round(y - n / 2), n, n); return true;
}
function drawBall(x, y, r){
  if (ballPx(x, y, Math.max(5, r * 1.8))) return;
  const cx = Math.round(x), cy = Math.round(y), Rr = Math.max(1, Math.round(r));
  if (Rr < 2){ R(cx - 1, cy - 1, 2, 2, '#f4f1e8'); R(cx - 1, cy, 2, 1, '#2a2f45'); return; }
  for (let dy = -Rr; dy <= Rr; dy++) for (let dx = -Rr; dx <= Rr; dx++){
    const d = Math.hypot(dx, dy); if (d > Rr + .35) continue;
    let c;
    if (d > Rr - .6) c = '#262b40';                                   // rim
    else {
      const l = (-dx - dy) / (Rr * 1.4);
      c = l > .35 ? '#ffffff' : l > -.1 ? '#f1eee5' : l > -.5 ? '#cbc8c3' : '#9b9ca9';
      const sx = Math.abs(dx) - (.62 * Rr - .5 * dy * dy / Rr);       // two curved seams, red stitches
      if (Math.abs(dy) < Rr * .8 && Math.abs(sx) < .6 && Rr >= 3) c = l > -.1 ? '#e0453a' : '#a52a2a';
    }
    R(cx + dx, cy + dy, 1, 1, c);
  }
}

// ── the aim pad ───────────────────────────────────────────────────────────
// The strike zone on the field is small, so while you aim a big copy of it sits to the side of the plate (away from the batter).
// The box is the strike zone at 2x; the pad goes 0.6 of a zone further on every side so you can throw off the plate too.
// You tap on the pad and the ball goes to that exact spot in the real zone.
const PAD_RNG = 1.6;                                              // zone units from the middle to the edge of the pad (1 = the edge of the strike zone)
function padGeom(){
  const lefty = !!(M && M.batter && M.batter.bats === 'L'), ux = ZONE.w, uy = ZONE.h;      // pad pixels per zone unit: 2x the zone on the field
  return { cx: W / 2 + (lefty ? -74 : 74), cy: 112, ux, uy, w: 2 * PAD_RNG * ux, h: 2 * PAD_RNG * uy };
}
function padHit(p){
  const G = padGeom(); return p.x >= G.cx - G.w / 2 - 4 && p.x <= G.cx + G.w / 2 + 4 && p.y >= G.cy - G.h / 2 - 4 && p.y <= G.cy + G.h / 2 + 4;
}
function padAim(p){                                              // where a tap on the pad lands, in zone units
  const G = padGeom(); return { x: clamp((p.x - G.cx) / G.ux, -PAD_RNG, PAD_RNG), y: clamp((p.y - G.cy) / G.uy, -PAD_RNG, PAD_RNG) };
}
function drawAimPad(ax, ay, dIn){

  tt('AIM', x0 + 1, y0 - 6, 13, '#ffffff', 'left');
  g.fillStyle = 'rgba(80,84,96,.38)'; g.fillRect(x0, y0, G.w, G.h);                                        // off the plate: a ball
  g.fillStyle = 'rgba(48,128,70,.55)'; g.fillRect(G.cx - G.ux, G.cy - G.uy, 2 * G.ux, 2 * G.uy);           // the strike zone
  g.strokeStyle = 'rgba(235,245,235,.5)'; g.lineWidth = .6; g.beginPath();
  for (const k of [-1 / 3, 1 / 3]){ g.moveTo(G.cx + k * G.ux, G.cy - G.uy); g.lineTo(G.cx + k * G.ux, G.cy + G.uy); g.moveTo(G.cx - G.ux, G.cy + k * G.uy); g.lineTo(G.cx + G.ux, G.cy + k * G.uy); }
  g.stroke();
  g.strokeStyle = '#ffffff'; g.lineWidth = 1; g.strokeRect(G.cx - G.ux, G.cy - G.uy, 2 * G.ux, 2 * G.uy);

// The ball-in-play view: straight down on the whole park, every player the same small size.
const AER = { w:1312, h:1199, plate:[655,1050], k:4.95 };
const AER_Y = [[0,0],[63.6,305],[127.3,514],[300,885]];           // feet out from the plate -> picture pixels up
function aerPt(depth, lat){

    const a = AER_Y[i-1], b = AER_Y[i]; py = lerp(a[1], b[1], (depth - a[0]) / (b[0] - a[0])); break; }
  const sc = 240 / AER.h, x0 = W / 2 - AER.w * sc / 2;

function drawAerial(B, bt){
  const sc = 240 / AER.h, x0 = W / 2 - AER.w * sc / 2, im = IMG.aerial;

  const batS = B.foul ? 0 : B.isCatch ? 25 : 90 * (B.runN || 1);
  const bp = basePathPos(Math.min(batS, runDist(spdOf(M.batter), B.t - CFG.RUN_START_DELAY - CFG.BATTER_EXTRA)));

// ── fusing: two cards with one face (+7) or one position (+3), in the same range: 60-64, 65-69, 70-74 and so on ──
const bandOf = r => Math.floor(r / 5) * 5;

  return 'p' + c.pos + '|' + band;
}
function fuseGroups(mode){
  const m = new Map();
  G.cards.filter(c => (c.fz || 0) < 2).forEach(c => { const k = fuseKey(c, mode); if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
  const out = []; m.forEach((list, k) => { if (list.length >= 2) out.push({ k, list:list.sort((a, b) => ovrOf(b) - ovrOf(a)), band:+k.split('|')[1], top:ovrOf(list[0]) }); });

}
const fuseRating = (a, b, mode) => clamp(Math.floor((ovrOf(a) + ovrOf(b)) / 2 + (mode === 'face' ? 7 : 3) + .5), 60, 120);
const canFuse = (a, b, mode) => !!(a && b && a.id !== b.id && (a.fz || 0) < 2 && (b.fz || 0) < 2 && fuseKey(a, mode) === fuseKey(b, mode) && !(inUse(a.id) && inUse(b.id)));

  if (!canFuse(a, b, mode)) return null;
  const slotCard = inUse(a.id) ? a : inUse(b.id) ? b : null;
  const o = {};
  if (mode === 'face') o.face = portraitFor(a);
  if (slotCard || mode === 'pos') o.pos = slotCard ? slotCard.pos : a.pos;            // a lineup spot keeps his position
  const nc = makeCardAt(fuseRating(a, b, mode), o);

const STREAK_COINS = [500, 1000, 0, 2000, 0, 3000];                     // days 3, 5 and 7 are packs instead

  for (let i = Math.round(h * .55); i < h - 2; i++) R(x + 1, y + 1 + i, w - 2, 1, mix(P.frame, P.dark, clamp((i - h * .55) / (h * .45), 0, 1)));

// ── simulating ─────────────────────────────────────────────────────────────
function simPitch(){
  SIMMING = true; if (!weBat()) M.pitchSimmed = true;
  try { return simPitchInner(); } finally { SIMMING = false; }
}
function simPitchInner(){
  // A quick at-bat with no animation. The base rates are the ones the user wants: about a
  // .300 average, one home run per team per game and 22% strikeouts. A player's ratings push
  // each rate up or down from there.
  const b = M.batter, p = curPitcher();
  { const g1 = pg(p), n1 = ri(3, 5); g1.pc += n1; g1.sp = spOf(g1) + n1; }
  // Ratings swing the result hard: a lineup of red cards (110+) should bury an average team,
  // and a green-card lineup (70s) should get buried. 85 is the middle of the league.
  const con = (b.contact - 85) / 30, pow = (b.power - 85) / 30, spd = (spdOf(b) - 85) / 30;
  const vel = (p.velocity - 85) / 30, ctl = (p.control - 85) / 30, tired = fatigue() * .35;
  let k  = clamp(.22 - con * .040 + vel * .060 - tired * .05, .02, .55);
  let bb = clamp(.085 + con * .010 - ctl * .034 + tired * .10, .01, .30);
  let hr = clamp(.026 + pow * .015 - vel * .014 + tired * .012, .001, .20);
  let h1 = clamp(.190 + con * .032 + spd * .012 - ctl * .034 + tired * .03, .03, .36);
  let h2 = clamp(.055 + con * .010 + pow * .008 - ctl * .013, .006, .14);
  let h3 = clamp(.005 + spd * .004, 0, .03);
  // test hook: pretend the person playing is better than the computer would be with the same cards
  if (window.__EDGE && weBat()){ const e = window.__EDGE; h1 *= e; h2 *= e; h3 *= e; hr *= e; k /= e; }
  if (window.__EDGE && !weBat()) k *= window.__EDGE;
  const r = Math.random();
  let a = k;                       if (r < a) return applyPlay('k');
  a += bb;                         if (r < a) return applyPlay(chance(.07) ? 'hbp' : 'bb');
  a += hr;                         if (r < a) return applyPlay('hr');
  a += h1;                         if (r < a) return applyPlay('single');
  a += h2;                         if (r < a) return applyPlay('double');
  a += h3;                         if (r < a) return applyPlay('triple');
  a += .012;                       if (r < a) return applyPlay('error');
  // everything left is an out in play; with a runner on first a grounder can turn two
  if (M.bases[0] && M.outs < 2 && chance(.22)) return applyPlay('dp');
  return applyPlay(pick(['groundout','groundout','flyout','flyout','lineout']));
}
function simRest(){
  let guard = 0;
  while (!M.over && guard++ < 4000) simPitch();
  if (!M.over) gameOver();
  phase = 'over';
}
function simHalfIfNeeded(){
  // if the user only plays one side, sim the other side's half inning
  if (M.over) return false;
  if ((M.mode === 'offense' && !weBat()) || (M.mode === 'defense' && weBat())){
    const side = M.top, inn = M.inning;
    let guard = 0;
    while (!M.over && M.top === side && M.inning === inn && guard++ < 300) simPitch();
    return true;
  }
  return false;
}
