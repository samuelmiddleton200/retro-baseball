<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no zooming; the game fills the screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- opened from the home screen: no Safari bars, black status bar -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- black-translucent: the page always runs under the status bar area, so iOS has no bar-sized strip to
     leave behind when the app opens sideways (the game already keeps clear of the notch itself) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retro Baseball">
<meta name="theme-color" content="#0b1018">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}   /* no bounce, no double-tap zoom */
  /* like an app: the page itself never moves; long menus scroll inside the game area.
     The page is pinned to the screen (position:fixed) so it cannot sit scrolled or pushed off to one side, and its
     height comes from --app-h, the size the script below measures, because an iPhone opened sideways sometimes
     hands the page a stale size or offset for a moment (the "whole screen shifted over" launch). */
  html,body{position:fixed;left:0;top:0;width:100%;height:100%;height:var(--app-h,100%);overflow:hidden}
  #ui{height:100%;height:100dvh;height:var(--app-h,100dvh);min-height:0 !important;overflow:hidden;overscroll-behavior:none}
  #game{height:var(--app-h,100%);bottom:auto !important}
  /* the stats list is the only screen allowed to scroll, and only up and down */
</style>
<script>
  // Launch guard for the shifted screen: measure the real screen, pin the page to it, put the page back at 0,0,
  // and if the iPhone is still reporting a stale size make it measure again. Runs at launch, a few more times in
  // the first seconds, and whenever the app comes back, rotates or resizes. It never reloads the app.
  (function(){
    var root = document.documentElement, nudges = 0, last = '';
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = function(){ return navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches); };
    var angle = function(){ var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : window.orientation; return typeof a === 'number' ? Math.abs(a) % 180 : null; };
    // what the screen really is: on an iPhone home-screen app that is the whole display, turned the way the phone is held
    function real(){
      var w = window.innerWidth, h = window.innerHeight, a = angle();
      if (ios && standalone() && a !== null && screen.width && screen.height) {
        var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        var ew = a === 90 ? long : short, eh = a === 90 ? short : long;
        // only a big gap is a stale size (the page still thinks the phone is the other way up); small gaps are real bars
        if (Math.abs(w - ew) > 60 || Math.abs(h - eh) > 60) return { w:ew, h:eh, stale:true };
      }
      return { w:w, h:h, stale:false };
    }
    function settle(){
      try {
        var r = real(), vv = window.visualViewport;
        root.style.setProperty('--app-h', r.h + 'px');
        var moved = window.scrollX || window.scrollY || root.scrollTop || (document.body && document.body.scrollTop) || (vv && (vv.offsetTop || vv.offsetLeft || vv.pageTop || vv.pageLeft));
        if (moved) { window.scrollTo(0, 0); root.scrollTop = 0; if (document.body) document.body.scrollTop = 0; }
        if ((r.stale || moved) && nudges < 6) {                      // make the iPhone lay the page out again
          nudges++;
          var m = document.querySelector('meta[name=viewport]'), c = m && m.getAttribute('content');
          if (m) { m.setAttribute('content', c + ', height=device-height'); setTimeout(function(){ m.setAttribute('content', c); }, 60); }
        }
        var key = r.w + 'x' + r.h + (r.stale ? 's' : '') + (moved ? 'm' : '');
        if (key !== last) { last = key; setTimeout(function(){ window.dispatchEvent(new Event('resize')); }, 80); }   // the game re-fits its court
      } catch (e) {}
    }
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
    settle();
    [0, 60, 150, 300, 600, 1000, 1600, 2500, 4000].forEach(function(ms){ setTimeout(settle, ms); });
    ['DOMContentLoaded', 'load', 'pageshow', 'resize', 'orientationchange', 'focus'].forEach(function(ev){ window.addEventListener(ev, function(){ settle(); setTimeout(settle, 250); setTimeout(settle, 700); }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) { nudges = 0; settle(); setTimeout(settle, 250); setTimeout(settle, 700); } });
    if (window.visualViewport) { visualViewport.addEventListener('resize', settle); visualViewport.addEventListener('scroll', settle); }
  })();
</script>
<script>
  // No surprise updates: the app never reloads itself. A new version (only when we publish one) shows the
  // next time the app is closed and opened again, because the game loads fresh from the server at launch.
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {}));
</script>
<div id="ui">
<canvas id="cv"></canvas>
</div>
<style>
#ui{position:relative;width:100%;height:100vh;background:#0b1018;overflow:hidden;touch-action:none;
    font-family:ui-monospace,"Courier New",monospace;color:#fff;-webkit-user-select:none;user-select:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated}
</style>
<script>
(() => {
"use strict";
/* ───────────────────────────────────────────────────────────────────────────
   RETRO BASEBALL
   Swipe up to swing. Pick a pitch and a spot to pitch. Nine innings.
   Everything is drawn as pixel art on one small canvas that is scaled up, so
   the whole game stays sharp on a phone held sideways.
   ─────────────────────────────────────────────────────────────────────────── */

let W = 428; const H = 240;                   // the pixel canvas: fixed height, width follows the screen
const cv = document.getElementById('cv'), g = cv.getContext('2d', { alpha:false });
let SC = 1, OX = 0, OY = 0;                   // scale and letterbox offset, for turning taps into pixels

function fit(){
  const w = innerWidth, h = innerHeight, dpr = Math.min(3, devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  W = clamp(Math.round(H * (cv.width / cv.height)), 300, 640);   // no black bars on any phone
  SC = cv.height / H;
  OX = (cv.width - W * SC) / 2; OY = 0;
  ZONE.x = W / 2 - ZONE.w / 2;
  g.imageSmoothingEnabled = false;
}
// fit() is called once ZONE exists, further down

// ── little helpers ─────────────────────────────────────────────────────────
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b = 0) => b + Math.random() * (a - b);
const ri = (a, b) => Math.floor(rnd(b + 1, a));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
// bell-curve random: averages out, so extremes are rare
const bell = () => (Math.random() + Math.random() + Math.random()) / 3;

// ── ratings and their colors (the user's scale) ────────────────────────────
// 60-69 grey, 70-79 green, 80-89 blue, 90-99 yellow, 100-109 orange, 110-120 red
const TIERS = [
  { min:60,  col:'#9aa6bd', name:'Common' },
  { min:70,  col:'#54d67a', name:'Green'  },
  { min:80,  col:'#4aa3ff', name:'Blue'   },
  { min:90,  col:'#ffd23f', name:'Gold'   },
  { min:100, col:'#ff9330', name:'Orange' },
  { min:110, col:'#ff4d4d', name:'Red'    },
];
const tierOf = v => TIERS[clamp(Math.floor((v - 60) / 10), 0, 5)];
const colOf = v => tierOf(v).col;

// ── the 30 real teams (names only; every player is made up) ────────────────
const TEAMS = [
  ['BAL','Baltimore','Orioles','#df4601','#000000','AL','E'], ['BOS','Boston','Red Sox','#bd3039','#0c2340','AL','E'],
  ['NYY','New York','Yankees','#132448','#c4ced4','AL','E'],  ['TB','Tampa Bay','Rays','#092c5c','#8fbce6','AL','E'],
  ['TOR','Toronto','Blue Jays','#134a8e','#e8291c','AL','E'], ['CWS','Chicago','White Sox','#27251f','#c4ced4','AL','C'],
  ['CLE','Cleveland','Guardians','#0c2340','#e31937','AL','C'],['DET','Detroit','Tigers','#0c2340','#fa4616','AL','C'],
  ['KC','Kansas City','Royals','#004687','#bd9b60','AL','C'], ['MIN','Minnesota','Twins','#002b5c','#d31145','AL','C'],
  ['HOU','Houston','Astros','#002d62','#eb6e1f','AL','W'],    ['LAA','Los Angeles','Angels','#ba0021','#003263','AL','W'],
  ['ATH','Athletics','Athletics','#003831','#efb21e','AL','W'],['SEA','Seattle','Mariners','#0c2c56','#005c5c','AL','W'],
  ['TEX','Texas','Rangers','#003278','#c0111f','AL','W'],     ['ATL','Atlanta','Braves','#13274f','#ce1141','NL','E'],
  ['MIA','Miami','Marlins','#00a3e0','#ef3340','NL','E'],     ['NYM','New York','Mets','#002d72','#ff5910','NL','E'],
  ['PHI','Philadelphia','Phillies','#e81828','#002d72','NL','E'],['WSH','Washington','Nationals','#ab0003','#14225a','NL','E'],
  ['CHC','Chicago','Cubs','#0e3386','#cc3433','NL','C'],      ['CIN','Cincinnati','Reds','#c6011f','#000000','NL','C'],
  ['MIL','Milwaukee','Brewers','#12284b','#ffc52f','NL','C'], ['PIT','Pittsburgh','Pirates','#27251f','#fdb827','NL','C'],
  ['STL','St. Louis','Cardinals','#c41e3a','#0c2340','NL','C'],['ARI','Arizona','Diamondbacks','#a71930','#e3d4ad','NL','W'],
  ['COL','Colorado','Rockies','#333366','#c4ced4','NL','W'],  ['LAD','Los Angeles','Dodgers','#005a9c','#ffffff','NL','W'],
  ['SD','San Diego','Padres','#2f241d','#ffc425','NL','W'],   ['SF','San Francisco','Giants','#fd5a1e','#27251f','NL','W'],
].map(t => ({ ab:t[0], city:t[1], nick:t[2], c1:t[3], c2:t[4], lg:t[5], div:t[6] }));

// ── made-up player names ───────────────────────────────────────────────────
const FIRST = ['Cole','Hank','Marco','Ty','Deion','Rico','Jax','Nolan','Ozzie','Luis','Kai','Brett','Dax','Omar','Cruz','Sal',
  'Rhett','Milo','Zeke','Trey','Dusty','Cash','Vance','Pablo','Rory','Kip','Sandy','Bo','Junior','Ace','Kenji','Isaia','Tito',
  'Wes','Duke','Gus','Hollis','Reggie','Yuki','Diego','Shane','Buck','Moe','Elio','Rocco','Jett','Levi','Cy','Nico','Bram'];
const LAST = ['Vasquez','Okafor','Brandt','Delgado','Cobb','Hollins','Tanaka','Mercer','Rios','Falk','Whitmore','Nakamura',
  'Baptiste','Kowalski','Sutter','Ferrell','Ortiz','Grady','Lindqvist','Beaumont','Castillo','Pike','Mullen','Araya','Stroud',
  'Vega','Barnhart','Oyelaran','Lacroix','Prescott','Guzman','Boone','Ishikawa','Reyes','Hatcher','Quill','Marchetti','Dupree',
  'Salazar','Crowe','Abara','Thibault','Youngblood','Esparza','Mahoney','Nkemelu','Rask','Tovar','Winslow','Zamora'];
const POS = ['C','1B','2B','3B','SS','LF','CF','RF','DH'];

// how much each spot leans on each rating, so a shortstop fields and a corner bat hits
const POSBIAS = {
  C:  { fielding:8,  speed:-10, power:2,  contact:0 },  '1B': { fielding:-2, speed:-8, power:9,  contact:1 },
  '2B':{ fielding:5,  speed:5,   power:-6, contact:4 },  '3B': { fielding:4,  speed:-2, power:6,  contact:0 },
  SS: { fielding:9,  speed:6,   power:-5, contact:2 },  LF:  { fielding:-1, speed:2,  power:5,  contact:1 },
  CF: { fielding:6,  speed:9,   power:-2, contact:2 },  RF:  { fielding:2,  speed:2,  power:7,  contact:0 },
  DH: { fielding:-14,speed:-6,  power:9,  contact:5 },
};

function makeHitter(level, pos){
  const base = () => clamp(Math.round(level + (bell() - .5) * 26), 60, 120);
  const b = POSBIAS[pos] || POSBIAS.DH;
  const p = {
    name: pick(FIRST) + ' ' + pick(LAST), pos,
    contact: clamp(base() + b.contact, 60, 120), power: clamp(base() + b.power, 60, 120),
    speed: clamp(base() + b.speed, 60, 120),   fielding: clamp(base() + b.fielding, 60, 120),
    bats: chance(.3) ? 'L' : 'R', look: look(),
  };
  p.ovr = Math.round((p.contact + p.power + p.speed + p.fielding) / 4);
  p.st = newStat();
  return p;
}
function makePitcher(level, role){
  const base = () => clamp(Math.round(level + (bell() - .5) * 26), 60, 120);
  const p = {
    name: pick(FIRST) + ' ' + pick(LAST), pos: role,          // 'SP' | 'RP' | 'CP'
    velocity: base(), control: base(), stamina: role === 'SP' ? base() : clamp(base() - 14, 60, 120),
    batting: clamp(Math.round(62 + bell() * 16), 60, 120),
    throws: chance(.28) ? 'L' : 'R', look: look(),
  };
  p.ovr = Math.round((p.velocity + p.control + p.stamina + p.batting) / 4);
  // 2-4 pitches, each with its own rating; everybody owns a fastball
  const all = ['FB','CV','SL','CH'];
  const n = 2 + (p.ovr > 95 ? 2 : p.ovr > 80 ? 1 : 0) + (chance(.4) ? 1 : 0);
  p.pitches = {};
  ['FB', ...all.slice(1).sort(() => Math.random() - .5)].slice(0, clamp(n, 2, 4))
    .forEach(k => p.pitches[k] = clamp(Math.round(p.ovr + (bell() - .5) * 22), 60, 120));
  p.st = newStat();
  return p;
}
const newStat = () => ({ ab:0, h:0, hr:0, rbi:0, r:0, bb:0, k:0, ip:0, er:0, ko:0, w:0, l:0, sb:0, pa:0 });
// a face/body recipe so every player looks different
function look(){
  return { skin: pick(['#f2c9a0','#e0ad7e','#c88e5e','#9c6336','#6f4324','#4b2d18']),
           hair: pick(['#120d0a','#2b1a10','#5a3a1c','#8a6a2a','#c8a04a','#d8d8d8','#120d0a','#2b1a10']),
           beard: chance(.4) ? 1 : 0, bulk: rnd(1.15, .85) };
}

// ── season-long state ──────────────────────────────────────────────────────
const SAVE = 'retrobaseball.v1';
let G = null;

function newGame(teamAb){
  const lvl = () => 70 + bell() * 28;
  _cardId = 1;
  const teams = TEAMS.map(t => {
    const lineup = POS.map(p => makeHitter(lvl(), p));
    const rot = [0,1,2,3,4].map(() => makePitcher(lvl(), 'SP'));
    const pen = [0,1,2,3].map(() => makePitcher(lvl(), 'RP')).concat([makePitcher(lvl() + 6, 'CP')]);
    [...lineup, ...rot, ...pen].forEach(p => { p.num = ri(1, 72); });
    return { ...t, lineup, rot, pen, w:0, l:0, rs:0, ra:0 };
  });
  G = { v:2, team: teams.findIndex(t => t.ab === teamAb), teams, day:0, coins:2500, seasonLen:25,
        sched:[], rotIdx:0, cards:[], slots:{ lineup:[], rot:[], pen:[] }, freeAt:0 };
  // your own nine, five starters and five relievers all become cards you own
  const me = G.teams[G.team];
  const own = p => { p.id = _cardId++; p.lvl = 0; p.ovr = ovrOf(p); G.cards.push(p); return p.id; };
  G.slots.lineup = me.lineup.map(own);
  G.slots.rot = me.rot.map(own);
  G.slots.pen = me.pen.map(own);
  makeSchedule();
  save();
}
// point the team at whatever cards are in the slots right now
function rebuildTeam(){
  const me = G.teams[G.team];
  const get = id => cardById(id) || me.lineup[0];
  me.lineup = G.slots.lineup.map(get);
  me.rot = G.slots.rot.map(get);
  me.pen = G.slots.pen.map(get);
}
function makeSchedule(){
  // every day our team plays somebody; opponents rotate through the league
  const me = G.team, others = G.teams.map((_, i) => i).filter(i => i !== me);
  G.sched = [];
  for (let d = 0; d < G.seasonLen; d++){
    const opp = others[(d * 7 + 3) % others.length];
    G.sched.push({ opp, home: d % 2 === 0, done:false, rs:0, ra:0 });
  }
}
const save = () => {
  try {
    // our own players live in G.cards; the team just points at them, so blank those
    // three lists before saving and build them again on load
    const me = G.teams[G.team], keep = { lineup:me.lineup, rot:me.rot, pen:me.pen };
    me.lineup = me.rot = me.pen = null;
    const txt = JSON.stringify(G);
    me.lineup = keep.lineup; me.rot = keep.rot; me.pen = keep.pen;
    localStorage.setItem(SAVE, txt);
  } catch(e){}
};
const load = () => {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE));
    if (d && d.v === 2){
      G = d;
      _cardId = Math.max(1, ...G.cards.map(c => c.id || 0)) + 1;
      G.cards.forEach(c => { c.st = c.st || newStat(); });
      rebuildTeam();
    }
  } catch(e){}
};
const myTeam = () => G.teams[G.team];

// ───────────────────────────────────────────────────────────────────────────
//  PIXEL ART
//  Everything is drawn with small rectangles so it stays crisp when scaled up.
// ───────────────────────────────────────────────────────────────────────────
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); };
const shade = (hex, amt) => {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v + 255 * amt), 0, 255);
  return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
};
function text(s, x, y, c = '#fff', size = 7, align = 'left'){
  g.font = `${size}px ui-monospace, "Courier New", monospace`;
  g.textAlign = align; g.textBaseline = 'top'; g.fillStyle = c;
  g.fillText(s, x | 0, y | 0);
}
function textb(s, x, y, c = '#fff', size = 7, align = 'left'){
  // Small text gets a single soft shadow; big callouts get a full outline so they
  // carry over the grass and the crowd. A heavy outline on small text reads as a smudge.
  g.font = `${size}px ui-monospace, "Courier New", monospace`;
  g.textAlign = align; g.textBaseline = 'top';
  g.fillStyle = 'rgba(0,0,0,.72)';
  if (size >= 10) [[1,0],[-1,0],[0,1],[0,-1]].forEach(d => g.fillText(s, (x + d[0]) | 0, (y + d[1]) | 0));
  else g.fillText(s, (x + 1) | 0, (y + 1) | 0);
  g.fillStyle = c; g.fillText(s, x | 0, y | 0);
}

/* ───────────────────────────────────────────────────────────────────────────
   PIXEL RIG — the same way Retro Boxing draws its fighters.
   Shapes are rasterised into a pixel grid, shaded band by band, then given a
   dark outline. Every sprite is built once and cached, so the game only pays
   for it the first time a pose is seen.
   ─────────────────────────────────────────────────────────────────────────── */
const RW = 112, RH = 108;                       // the pixel grid one player is drawn on
const OUTL = '#120c18';

// ── colour maths ───────────────────────────────────────────────────────────
function hexToHsl(h){
  let [r, gq, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  const mx = Math.max(r, gq, b), mn = Math.min(r, gq, b), l = (mx + mn) / 2;
  let hh = 0, s = 0;
  if (mx !== mn){ const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    hh = mx === r ? (gq - b) / d + (gq < b ? 6 : 0) : mx === gq ? (b - r) / d + 2 : (r - gq) / d + 4; hh /= 6; }
  return [hh * 360, s, l];
}
function hslToHex(h, s, l){
  h = ((h % 360) + 360) % 360 / 360; l = clamp(l, 0, 1);
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
    return Math.round((l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255); };
  return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('');
}
// a ramp of shades from one colour: [hue shift, saturation x, lightness x, lift toward white]
function ramp(base, spec){
  const [h, s, l] = hexToHsl(base);
  return spec.map(([dh, ds, dl, lift]) =>
    hslToHex(h + dh, clamp(s * ds, 0, 1), lift ? l + (1 - l) * lift : l * dl));
}
function mix(a, b, t){
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  return '#' + [16, 8, 0].map(sh => Math.round(lerp((A >> sh) & 255, (B >> sh) & 255, clamp(t, 0, 1))))
    .map(v => v.toString(16).padStart(2, '0')).join('');
}

// every colour one player is painted with
function palette(look, c1, c2){
  const [s1, s2, s3, s4, s5] = ramp(look.skin, [[-16,.8,.34],[-9,.9,.58],[-4,.95,.82],[0,1,1],[6,.9,0,.34]]);
  const [j1, j2, j3, j4] = ramp(c1, [[-5,.9,.5],[-2,.95,.74],[0,1,1],[5,.9,0,.3]]);
  const pantBase = mix(c2 === '#ffffff' ? '#e9ecf2' : c2, '#ffffff', .45);
  const [p1, p2, p3] = ramp(pantBase, [[-3,.7,.62],[0,.8,1],[4,.6,0,.28]]);
  const hairBase = look.hair === '#120d0a' ? '#1d1510' : look.hair;
  const [r1, r2, r3] = ramp(hairBase, [[-5,.9,.55],[0,1,1],[5,.85,0,.3]]);
  return { K:OUTL, s1, s2, s3, s4, s5, j1, j2, j3, j4, p1, p2, p3, r1, r2, r3,
           boot:'#1d1a22', boot2:'#2e2a36', eye:'#f2efe6', iris:'#2a1c14',
           bat:'#c79a5c', bat2:'#e0bb86', bat3:'#9a7340', leather:'#8a5f33', leather2:'#ab7a46',
           mesh:'#3a404e', mesh2:'#596273', white:'#f4f2ea' };
}

// ── the rasteriser ─────────────────────────────────────────────────────────
function Rig(PAL){
  const buf = new Array(RW * RH).fill(null);
  const tmp = document.createElement('canvas'); tmp.width = RW; tmp.height = RH;
  const tg = tmp.getContext('2d', { willReadFrequently:true });
  let part = null;
  const C = c => PAL[c] || c;
  // rasterise one shape and hand back which pixels it covers
  const mask = draw => {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const B = (x, y, r = 0) => { if (x-r < x0) x0 = x-r; if (y-r < y0) y0 = y-r; if (x+r > x1) x1 = x+r; if (y+r > y1) y1 = y+r; };
    const rec = { moveTo:(x,y) => { B(x,y); tg.moveTo(x,y); }, lineTo:(x,y) => { B(x,y); tg.lineTo(x,y); },
      closePath:() => tg.closePath(),
      ellipse:(cx,cy,rx,ry,a,b,c) => { B(cx,cy,Math.max(rx,ry)); tg.ellipse(cx,cy,rx,ry,a,b,c); } };
    tg.beginPath(); draw(rec);
    const m = new Uint8Array(RW * RH);
    const bx = Math.max(0, Math.floor(x0) - 1), by = Math.max(0, Math.floor(y0) - 1);
    const bw = Math.min(RW, Math.ceil(x1) + 2) - bx, bh = Math.min(RH, Math.ceil(y1) + 2) - by;
    if (bw <= 0 || bh <= 0) return m;
    tg.clearRect(bx, by, bw, bh); tg.fillStyle = '#000'; tg.fill();
    const a = tg.getImageData(bx, by, bw, bh).data;
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++)
      m[(by + y) * RW + bx + x] = a[(y * bw + x) * 4 + 3] > 127;
    return m;
  };
  const poly = pts => gg => pts.forEach(([x, y], i) => i ? gg.lineTo(x + .5, y + .5) : gg.moveTo(x + .5, y + .5));
  return {
    // a body part: begin, paint into it, end (which adds the dark outline around it)
    begin(){ part = new Array(RW * RH).fill(null); },
    end(plain){
      const has = (x, y) => x >= 0 && y >= 0 && x < RW && y < RH && part[y * RW + x];
      if (!plain) for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++){
        const i = y * RW + x;
        if (!part[i] && (has(x+1,y) || has(x-1,y) || has(x,y+1) || has(x,y-1))) buf[i] = PAL.K;
      }
      for (let i = 0; i < RW * RH; i++) if (part[i]) buf[i] = part[i];
    },
    fill(col, pts){ const m = mask(poly(pts)), c = C(col); for (let i = 0; i < RW*RH; i++) if (m[i]) part[i] = c; },
    ell(col, cx, cy, rx, ry){ const m = mask(gg => gg.ellipse(cx+.5, cy+.5, rx, ry, 0, 0, 7)), c = C(col);
      for (let i = 0; i < RW*RH; i++) if (m[i]) part[i] = c; },
    // paint only where the part already is, for shading on top of a shape
    shade(col, pts){ const m = mask(poly(pts)), c = C(col); for (let i = 0; i < RW*RH; i++) if (m[i] && part[i]) part[i] = c; },
    shadeE(col, cx, cy, rx, ry){ const m = mask(gg => gg.ellipse(cx+.5, cy+.5, rx, ry, 0, 0, 7)), c = C(col);
      for (let i = 0; i < RW*RH; i++) if (m[i] && part[i]) part[i] = c; },
    dot(col, x, y, w = 1, h = 1){ const c = C(col); x = Math.round(x); y = Math.round(y);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
        if (x+i >= 0 && x+i < RW && y+j >= 0 && y+j < RH) part[(y+j) * RW + x+i] = c; },
    line(col, pts){ const c = C(col);
      for (let k = 1; k < pts.length; k++){
        const [ax, ay] = pts[k-1], [bx, by] = pts[k], n = Math.max(Math.abs(bx-ax), Math.abs(by-ay)) || 1;
        for (let t = 0; t <= n; t++){
          const x = Math.round(ax + (bx-ax)*t/n), y = Math.round(ay + (by-ay)*t/n);
          if (x >= 0 && x < RW && y >= 0 && y < RH && part[y*RW+x]) part[y*RW+x] = c;
        } } },
    // an arm or a leg: a tapered tube, lit on one edge and dark on the other
    limb(A, B, w1, w2, set = ['s2','s3','s4','s5'], crease){
      const dx = B[0]-A[0], dy = B[1]-A[1], L = Math.hypot(dx, dy) || 1;
      const vx = dx/L, vy = dy/L, nx = -vy, ny = vx;
      const m = mask(gg => {
        poly([[A[0]+nx*w1/2, A[1]+ny*w1/2], [B[0]+nx*w2/2, B[1]+ny*w2/2],
              [B[0]-nx*w2/2, B[1]-ny*w2/2], [A[0]-nx*w1/2, A[1]-ny*w1/2]])(gg);
        gg.moveTo(A[0]+.5+w1/2, A[1]+.5); gg.ellipse(A[0]+.5, A[1]+.5, w1/2, w1/2, 0, 0, 7);
        gg.moveTo(B[0]+.5+w2/2, B[1]+.5); gg.ellipse(B[0]+.5, B[1]+.5, w2/2, w2/2, 0, 0, 7);
      });
      const lit = (nx * .55 - ny * .84) > 0 ? 1 : -1;
      for (let y = 0; y < RH; y++) for (let x = 0; x < RW; x++){
        const i = y*RW + x; if (!m[i]) continue;
        const qx = x - A[0], qy = y - A[1];
        const u = (qx*vx + qy*vy) / L, d = (qx*nx + qy*ny) * lit;
        const w = (w1 + (w2-w1) * clamp(u, 0, 1)) / 2;
        let c = set[2];
        if (d > w - 1.3) c = set[3];
        else if (d < -(w - 1.6)) c = set[1];
        if (crease && u > .3 && u < .8 && Math.abs(d + w*.18) < .55) c = set[0];
        part[i] = C(c);
      }
    },
    toCanvas(){
      const cvv = document.createElement('canvas'); cvv.width = RW; cvv.height = RH;
      const cg = cvv.getContext('2d'), im = cg.createImageData(RW, RH);
      buf.forEach((c, i) => { if (!c) return; const n = parseInt(c.slice(1), 16);
        im.data[i*4] = n >> 16; im.data[i*4+1] = (n >> 8) & 255; im.data[i*4+2] = n & 255; im.data[i*4+3] = 255; });
      cg.putImageData(im, 0, 0); return cvv;
    },
  };
}

/* ── the body ───────────────────────────────────────────────────────────────
   Joints live in grid pixels. The figure faces RIGHT; lefties are mirrored
   when drawn. "near" is the arm/leg closer to the camera.                    */
const BASE = {
  head:[56,16], neck:[56,27], chest:[56,34], hip:[55,56],
  nSh:[53,30], fSh:[59,30],
  nEl:[50,42], nHa:[52,33], fEl:[56,42], fHa:[55,33],
  nKn:[50,76], nAn:[48,99], fKn:[60,76], fAn:[63,99],
  lean:0, turn:0, batA:null, gloveA:null, ball:null, crouch:0,
};

function buildPlayer(J, look, c1, c2, o = {}){
  const P = palette(look, c1, c2), S = Rig(P);
  const j = { ...BASE, ...J };
  const cr = j.crouch || 0, L = j.lean || 0;
  const T = ([x, y]) => [x + L * (1 - (y - 20) / 80), y + (y > 50 ? 0 : cr)];
  const hip = T(j.hip), chest = T(j.chest), neck = T(j.neck), head = T(j.head);
  const nSh = T(j.nSh), fSh = T(j.fSh);

  // ---- far leg, then near leg, so the near one sits on top -----------------
  const leg = (kn, an, near) => {
    S.begin();
    S.limb(hip, kn, near ? 11 : 10, near ? 8 : 7, ['p1','p1','p2','p3']);
    S.limb(kn, [an[0], an[1] - 3], near ? 8 : 7, near ? 6 : 5, ['p1','p1','p2','p3']);
    // the sock and the shoe
    S.limb([kn[0] + (an[0]-kn[0])*.62, kn[1] + (an[1]-kn[1])*.62], [an[0], an[1]-3], 7, 5.5, ['j1','j1','j2','j3']);
    S.fill('boot', [[an[0]-4, an[1]-4], [an[0]+5, an[1]-4], [an[0]+7, an[1]], [an[0]-4, an[1]]]);
    S.shade('boot2', [[an[0]-4, an[1]-4], [an[0]+5, an[1]-4], [an[0]+5, an[1]-2], [an[0]-4, an[1]-2]]);
    S.end();
  };
  leg(T(j.fKn), T(j.fAn), false);

  // ---- the far arm --------------------------------------------------------
  const arm = (sh, el, ha, near) => {
    S.begin();
    S.limb(sh, el, near ? 9 : 8, near ? 7 : 6, ['j1','j1','j2','j3']);        // sleeve
    S.limb(el, ha, near ? 6.5 : 5.5, near ? 5 : 4.5, ['s2','s2','s3','s4'], true);  // forearm
    S.ell(near ? 's3' : 's2', ha[0], ha[1], 3, 2.6);                           // hand
    S.end();
  };
  arm(fSh, T(j.fEl), T(j.fHa), false);

  // ---- torso --------------------------------------------------------------
  S.begin();
  S.fill('j2', [[nSh[0]-7, nSh[1]-3], [fSh[0]+7, fSh[1]-3], [hip[0]+8, hip[1]], [hip[0]-8, hip[1]]]);
  S.shade('j1', [[hip[0]-8, hip[1]-16], [hip[0]+8, hip[1]-16], [hip[0]+8, hip[1]], [hip[0]-8, hip[1]]]);   // under the ribs
  S.shade('j3', [[nSh[0]-7, nSh[1]-3], [fSh[0]+7, fSh[1]-3], [fSh[0]+6, fSh[1]+4], [nSh[0]-6, nSh[1]+4]]); // lit shoulders
  S.shade('j1', [[nSh[0]-7, nSh[1]-1], [nSh[0]-3, nSh[1]-2], [hip[0]-5, hip[1]], [hip[0]-8, hip[1]]]);     // shadow down the back
  // belt
  S.fill('boot', [[hip[0]-8, hip[1]-4], [hip[0]+8, hip[1]-4], [hip[0]+8, hip[1]], [hip[0]-8, hip[1]]]);
  S.dot('j4', hip[0]-1, hip[1]-3, 3, 3);
  if (o.front){
    S.dot('j1', hip[0], hip[1]-20, 1, 16);                                      // the button placket down the front
    S.dot('j3', hip[0]-1, hip[1]-20, 1, 16);
  }
  if (o.number != null && !o.front){                                            // the number across his back
    const dig = String(o.number).split('');
    dig.forEach((d, i) => {
      const x0 = hip[0] - (dig.length * 5) / 2 + i * 5, y0 = hip[1] - 17;
      NUM[d].forEach(([dx, dy, w, h]) => S.dot('white', x0 + dx, y0 + dy, w || 1, h || 1));
    });
  }
  S.end();

  // ---- head, cap, hair ----------------------------------------------------
  S.begin();
  S.limb(neck, [neck[0], neck[1]-4], 7, 7, ['s1','s1','s2','s3']);              // neck
  S.ell('s4', head[0], head[1], 8, 8.5);
  S.shadeE('s3', head[0]-3, head[1]+1, 5, 7);                                   // the far side of the face
  S.shadeE('s2', head[0]-6, head[1]+3, 3, 5);
  S.shadeE('s5', head[0]+4, head[1]-3, 3.5, 3.5);                               // light on the cheekbone
  S.shade('s2', [[head[0]-8, head[1]+5], [head[0]+8, head[1]+5], [head[0]+8, head[1]+9], [head[0]-8, head[1]+9]]);  // jaw shadow
  if (look.beard){
    S.shade('r1', [[head[0]-6, head[1]+2], [head[0]+8, head[1]+1], [head[0]+8, head[1]+9], [head[0]-5, head[1]+8]]);
  }
  if (o.front){
    // seen head on: two eyes, a nose down the middle, the brim across the brow
    S.shadeE('s3', head[0], head[1]+4, 7, 4);
    S.dot('eye', head[0]-4, head[1]-1, 3, 2); S.dot('iris', head[0]-3, head[1]-1, 1, 2);
    S.dot('eye', head[0]+2, head[1]-1, 3, 2); S.dot('iris', head[0]+3, head[1]-1, 1, 2);
    S.dot('s1', head[0]-5, head[1]-3, 4, 1); S.dot('s1', head[0]+2, head[1]-3, 4, 1);
    S.dot('s3', head[0], head[1]+1, 1, 3);                                      // nose
    S.dot('s2', head[0]-2, head[1]+5, 5, 1);                                    // mouth
    S.shade('r2', [[head[0]-9, head[1]-5], [head[0]+9, head[1]-5], [head[0]+9, head[1]-1], [head[0]-9, head[1]-1]]);
    S.fill('j2', [[head[0]-9, head[1]-3], [head[0]-6, head[1]-10], [head[0]+6, head[1]-10], [head[0]+9, head[1]-3]]);
    S.shade('j3', [[head[0]-5, head[1]-10], [head[0]+4, head[1]-10], [head[0]+5, head[1]-6], [head[0]-5, head[1]-6]]);
    S.fill('j1', [[head[0]-10, head[1]-4], [head[0]+10, head[1]-4], [head[0]+9, head[1]-1], [head[0]-9, head[1]-1]]); // brim
    S.dot('j4', head[0]-1, head[1]-8, 2, 2);
  } else {
    // in profile: one eye, the ear, and the brim pointing the way he looks
    S.dot('s2', head[0]-2, head[1], 2, 3);
    S.dot('eye', head[0]+4, head[1]-1, 3, 2); S.dot('iris', head[0]+5, head[1]-1, 1, 2);
    S.dot('s1', head[0]+3, head[1]-3, 4, 1);
    S.dot('s2', head[0]+4, head[1]+4, 3, 1);
    S.dot('s5', head[0]+7, head[1]+1, 1, 2);                                    // nose tip
    S.shade('r2', [[head[0]-9, head[1]-4], [head[0]+2, head[1]-6], [head[0]+2, head[1]-2], [head[0]-9, head[1]+2]]);
    S.shade('r1', [[head[0]-9, head[1]-1], [head[0]-4, head[1]-2], [head[0]-4, head[1]+3], [head[0]-9, head[1]+3]]);
    S.fill('j2', [[head[0]-9, head[1]-3], [head[0]-7, head[1]-9], [head[0]+3, head[1]-10], [head[0]+8, head[1]-5], [head[0]+8, head[1]-2]]);
    S.shade('j3', [[head[0]-7, head[1]-9], [head[0]+2, head[1]-10], [head[0]+4, head[1]-7], [head[0]-6, head[1]-6]]);
    S.shade('j1', [[head[0]-9, head[1]-4], [head[0]-5, head[1]-5], [head[0]-5, head[1]-2], [head[0]-9, head[1]-2]]);
    S.fill('j1', [[head[0]+7, head[1]-5], [head[0]+14, head[1]-4], [head[0]+14, head[1]-2], [head[0]+7, head[1]-2]]);   // brim
    S.dot('j4', head[0]-2, head[1]-8, 2, 2);
  }
  if (o.helmet){                                                                // batting helmet: an ear flap
    S.fill('j1', [[head[0]-9, head[1]-3], [head[0]-9, head[1]+5], [head[0]-3, head[1]+6], [head[0]-2, head[1]-2]]);
    S.shade('j2', [[head[0]-8, head[1]-2], [head[0]-5, head[1]-2], [head[0]-5, head[1]+3], [head[0]-8, head[1]+3]]);
  }
  if (o.mask){                                                                  // catcher's mask
    S.fill('mesh', [[head[0]+2, head[1]-8], [head[0]+11, head[1]-6], [head[0]+11, head[1]+7], [head[0]+2, head[1]+8]]);
    for (let i = -5; i <= 6; i += 3) S.dot('mesh2', head[0]+3, head[1]+i, 8, 1);
  }
  S.end();

  // ---- the near arm, and whatever it is holding ---------------------------
  arm(nSh, T(j.nEl), T(j.nHa), true);
  const nHa = T(j.nHa), fHa = T(j.fHa);
  if (j.batA != null){
    const a = j.batA * Math.PI / 180, grip = [(nHa[0] + fHa[0]) / 2, (nHa[1] + fHa[1]) / 2];
    const tip = [grip[0] + Math.cos(a) * 38, grip[1] + Math.sin(a) * 38];
    const mid = [grip[0] + Math.cos(a) * 22, grip[1] + Math.sin(a) * 22];
    S.begin();
    S.limb(grip, mid, 3.4, 5, ['bat3','bat3','bat','bat2']);
    S.limb(mid, tip, 5, 6.4, ['bat3','bat3','bat','bat2']);
    S.limb([grip[0] - Math.cos(a)*3, grip[1] - Math.sin(a)*3], grip, 4, 3.4, ['boot','boot','boot2','boot2']);  // the knob
    S.end();
  }
  if (j.gloveA != null){
    const a = j.gloveA * Math.PI / 180, c = [nHa[0] + Math.cos(a) * 5, nHa[1] + Math.sin(a) * 5];
    S.begin();
    S.ell('leather', c[0], c[1], 7, 6.5);
    S.shadeE('leather2', c[0]+2, c[1]-2, 4, 3.5);
    S.shade('boot', [[c[0]-7, c[1]+3], [c[0]+7, c[1]+3], [c[0]+7, c[1]+7], [c[0]-7, c[1]+7]]);
    S.end();
  }
  if (j.ball){
    S.begin(); S.ell('white', j.ball[0], j.ball[1], 2.6, 2.6);
    S.dot('#d8342c', j.ball[0]-1, j.ball[1], 3, 1); S.end();
  }
  leg(T(j.nKn), T(j.nAn), true);
  return S.toCanvas();
}
// 5x7 digits for the back of the jersey
const NUM = {
  '0':[[0,0,3,1],[0,1,1,5],[2,1,1,5],[0,6,3,1]], '1':[[1,0,1,7],[0,1,1,1],[0,6,3,1]],
  '2':[[0,0,3,1],[2,1,1,2],[0,3,3,1],[0,4,1,2],[0,6,3,1]], '3':[[0,0,3,1],[2,1,1,5],[0,3,2,1],[0,6,3,1]],
  '4':[[0,0,1,4],[2,0,1,7],[0,3,3,1]], '5':[[0,0,3,1],[0,1,1,2],[0,3,3,1],[2,4,1,2],[0,6,3,1]],
  '6':[[0,0,3,1],[0,1,1,5],[0,3,3,1],[2,4,1,2],[0,6,3,1]], '7':[[0,0,3,1],[2,1,1,6]],
  '8':[[0,0,3,1],[0,1,1,5],[2,1,1,5],[0,3,3,1],[0,6,3,1]], '9':[[0,0,3,1],[0,1,1,2],[2,1,1,5],[0,3,3,1],[0,6,3,1]],
};

/* ── poses ──────────────────────────────────────────────────────────────────
   One number drives each animation, so the motion is smooth instead of a few
   stepped frames. The batter faces right; the pitcher is seen from the front.
   ─────────────────────────────────────────────────────────────────────────── */
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const LP = (A, B, t) => [lerp(A[0], B[0], t), lerp(A[1], B[1], t)];

/* The swing, as one value:
   t < 0  idle, breathing;  0 → .22 load back;  .22 → .58 the swing;
   .58 contact;  .58 → 1 the follow through.                                   */
function batterPose(t, idle){
  if (t == null){                                           // waiting for the pitch
    const b = Math.sin(idle / 15), w = Math.sin(idle / 9);
    return { crouch: 3 + b * .5, lean: -1,
      hip:[54,56], chest:[55,34], neck:[55,27], head:[56,16],
      nSh:[50,31], fSh:[59,30],
      nEl:[46,39 + b], nHa:[44,27 + b * .6], fEl:[49,41 + b], fHa:[46,29 + b * .6],
      nKn:[48,76], nAn:[45,99], fKn:[62,75], fAn:[66,99],
      batA: -103 + w * 7, helmet:1 };
  }
  // four beats: stance -> load back -> stride and fire -> wrap it up
  const ld = ease(seg(t, 0, .22)), sw = ease(seg(t, .22, .58)), fo = ease(seg(t, .58, 1));
  const K = (a, b, c, d) => lerp(lerp(lerp(a, b, ld), c, sw), d, fo);
  const J = (a, b, c, d) => [K(a[0], b[0], c[0], d[0]), K(a[1], b[1], c[1], d[1])];
  // the hands load back, then fire out in front, then wrap around his shoulder
  const hands = J([44,27], [41,24], [73,36], [76,20]);
  // the bat goes back past his head, whips all the way through, and finishes behind him
  const batA = K(-103, -126, 6, 128);
  const hipX = K(54, 52, 58, 59);                              // weight shifts back, then drives forward
  const open = K(0, -1, 7, 9);                                 // how far the shoulders have turned
  return {
    crouch: K(3, 5, 1, 2), lean: K(-1, -3, 3, 5),
    hip:[hipX, 56], chest:[hipX + 1, 34], neck:[hipX + 1, 27], head:[56, K(16, 16, 15, 14)],
    nSh:[50 + open, 31], fSh:[59 + open * .5, 30],
    nEl:[K(46,44,62,60), K(39,37,42,34)], nHa:hands,
    fEl:[K(49,47,64,62), K(41,39,44,36)], fHa:[hands[0] - 3, hands[1] + 3],
    // back leg: heel comes up and the knee drives in behind the ball
    nKn:[K(48, 47, 53, 55), K(76, 77, 78, 80)], nAn:[K(45, 44, 48, 50), K(99, 99, 97, 96)],
    // front leg: lifts a little, strides out at the pitcher, then braces straight
    fKn:[K(62, 62, 67, 69), K(75, 72, 76, 74)], fAn:[K(66, 65, 73, 73), K(99, 94, 99, 99)],
    batA, helmet:1,
  };
}

/* The windup, seen from the front: set, leg lift, stride, release, follow. */
function pitcherPose(u){
  const lift = seg(u, .10, .40), stride = seg(u, .40, .66), rel = seg(u, .66, .78), fol = seg(u, .78, 1);
  const e = ease(lift), s = ease(stride), f = ease(fol);
  // the glove hand and the throwing hand
  let glove = LP([56,36], [58,24], e); glove = LP(glove, [44,30], s); glove = LP(glove, [40,46], rel);
  let hand  = LP([56,36], [64,30], e); hand  = LP(hand, [78,18], s);
  hand = LP(hand, [60,4], rel); hand = LP(hand, [42,44], f);
  // the front leg lifts, then strides out toward the plate
  let fKn = LP([60,76], [52,48], e); fKn = LP(fKn, [44,72], s);
  let fAn = LP([62,99], [58,62], e); fAn = LP(fAn, [34,96], s);
  const nKn = LP([50,76], [52,80], s), nAn = LP([48,99], [56,96], s);
  const lean = lerp(0, -3, e) + s * 7 + f * 4;
  return {
    crouch: e * 2 + s * 4, lean,
    hip:[55,56], chest:[56,34], neck:[56,27], head:[56,16],
    nSh:[49,30], fSh:[63,30],
    nEl:LP([52,42], [hand[0] - 6, hand[1] + 10], 1), nHa:hand,
    fEl:[glove[0] + 5, glove[1] + 9], fHa:glove,
    nKn, nAn, fKn, fAn,
    gloveA: 150, front:1,
    ball: u < .70 ? null : undefined,
  };
}

// ── sprite cache: each pose is drawn once, then reused ─────────────────────
const SPR = new Map();
function sprite(key, make){
  let c = SPR.get(key);
  if (!c){ c = make(); SPR.set(key, c);
    if (SPR.size > 420){ const k = SPR.keys().next().value; SPR.delete(k); } }
  return c;
}
// players carry a short id so the same face always draws the same sprite
let _lookN = 0;
const lookKey = lk => lk.k || (lk.k = 'L' + (_lookN++) + lk.skin.slice(1,4) + lk.hair.slice(1,4) + (lk.beard||0));

// draw a built sprite so its feet land on (x, y); flip mirrors it for lefties
function blit(c, x, y, k, flip){
  const w = Math.round(RW * k), h = Math.round(RH * k);
  g.save();
  g.translate(x | 0, y | 0);
  if (flip) g.scale(-1, 1);
  g.drawImage(c, Math.round(-56 * k), Math.round(-100 * k), Math.round(w), Math.round(h));
  g.restore();
}
// the batter: swing is null when he is just standing in
function drawBatter(x, y, p, c1, c2, swingT, idle, num){
  const q = swingT == null ? -1 : Math.round(clamp(swingT, 0, 1) * 16) / 16;      // 17 steps is plenty
  const idleQ = swingT == null ? Math.round(idle / 6) % 24 : 0;
  const key = `B${lookKey(p.look)}|${c1}${c2}|${q}|${idleQ}|${num}`;
  const c = sprite(key, () => buildPlayer(
    swingT == null ? batterPose(null, idleQ * 6) : batterPose(q),
    p.look, c1, c2, { number:num, helmet:1 }));
  blit(c, x, y, .70, p.bats === 'L');
}
// the pitcher, from the front, at half size because he is out at the mound
function drawPitcher(x, y, p, c1, c2, u, num){
  const q = u == null ? 0 : Math.round(clamp(u, 0, 1) * 20) / 20;
  const key = `P${lookKey(p.look)}|${c1}${c2}|${q}`;
  const c = sprite(key, () => buildPlayer(pitcherPose(q), p.look, c1, c2, { front:1 }));
  blit(c, x, y, .5, false);
}
// the catcher, crouched with his back to us
function drawCatcher(x, y, p, c1, c2){
  const key = `C${lookKey(p.look)}|${c1}${c2}`;
  const c = sprite(key, () => buildPlayer({
      crouch:0, lean:0,
      hip:[56,74], chest:[56,54], neck:[56,45], head:[56,32],
      nSh:[47,50], fSh:[65,50],
      nEl:[36,62], nHa:[28,54], fEl:[76,62], fHa:[83,60],
      nKn:[32,82], nAn:[41,101], fKn:[80,82], fAn:[71,101],
      gloveA:200,
    }, p.look, c1, c2, { back:1, hardhat:1 }));
  blit(c, x, y, .52, false);
}
// a fielder far away in the replay: a few pixels, but still shaded
function drawMini(x, y, lk, c1, c2, k = 1){
  k = clamp(k, .5, 1.5);                                  // close up, the big sprites take over
  const w = Math.max(3, Math.round(5 * k)), u = Math.max(1, Math.round(k));
  const leg = Math.max(2, Math.round(3 * k)), tor = Math.max(3, Math.round(6 * k));
  const hd = Math.max(2, Math.round(4 * k));
  R(x - w / 2, y - leg, leg > 2 ? Math.round(w / 2.4) : 1, leg, '#e9ecf2');
  R(x + w / 2 - Math.round(w / 2.4), y - leg, leg > 2 ? Math.round(w / 2.4) : 1, leg, '#e9ecf2');
  R(x - w / 2, y - leg - tor, w, tor, c1);
  R(x + w / 2 - u, y - leg - tor, u, tor, shade(c1, -.18));
  R(x - w / 2, y - leg - tor, w, u, shade(c1, .16));
  R(x - w / 2, y - 1, w, 1, '#1d1a22');
  R(x - hd / 2, y - leg - tor - hd, hd, hd, lk.skin);
  R(x - hd / 2 - u, y - leg - tor - hd - u, hd + u * 2, Math.max(1, Math.round(2 * k)), c1);
  R(x - w / 2 - u, y - leg - tor + u, u, Math.round(tor * .6), '#8a5f33');   // his glove
}

// ── the ballpark seen from behind the batter ───────────────────────────────
const CROWD = ['#c9c3b4','#b89a9a','#92a6c0','#c4b47c','#a894b8','#9ab8a2','#cfab94','#848fa6','#aeb6c4','#9c8f82'];

/* ───────────────────────────────────────────────────────────────────────────
   THE FIELD, seen from up behind the batter.
   Everything is placed in real feet from home plate and projected onto the
   screen, so the diamond, the mound and the wall all sit where they should.
   ─────────────────────────────────────────────────────────────────────────── */
const HOME_Y = 198, HORIZON = 70, PC = 56, PK = 3.25;
const pscale = d => PC / (PC + d);
// d = feet out from home plate, lat = feet to the right of the middle
function proj(d, lat){
  const s = pscale(d);
  return { x: W / 2 + lat * s * PK, y: HOME_Y - (HOME_Y - HORIZON) * (1 - s), s };
}
// a point on the field given an angle off dead centre (-45 = left line, +45 = right)
const atAng = (ang, dist) => {
  const r = ang * Math.PI / 180;
  return proj(dist * Math.cos(r), dist * Math.sin(r));
};
const FIELDERS = [                                   // where the defence stands, in feet
  [100, 52, '1B'], [128, 34, '2B'], [128, -34, 'SS'], [100, -52, '3B'],
  [275, -150, 'LF'], [318, 4, 'CF'], [275, 150, 'RF'],
];

function drawField(park, t){
  const night = park.night;
  // ── where the wall sits on every column of the screen ───────────────────
  // (sampling by angle alone leaves gaps, so we work out a y per column)
  const baseY = new Float32Array(W + 1), topY = new Float32Array(W + 1);
  {
    const pts = [];
    for (let a = -58; a <= 58; a += .5){
      const d = wallDist(clamp(a, -45, 45)), p = atAng(a, d);
      pts.push({ x:p.x, y:p.y, h: clamp(park.wallH * p.s * 6.2, 9, 34) });
    }
    for (let x = 0; x <= W; x++){
      let lo = pts[0], hi = pts[pts.length - 1];
      for (let i = 0; i < pts.length - 1; i++)
        if (pts[i].x <= x && pts[i + 1].x >= x){ lo = pts[i]; hi = pts[i + 1]; break; }
      const k = hi.x === lo.x ? 0 : (x - lo.x) / (hi.x - lo.x);
      baseY[x] = lerp(lo.y, hi.y, clamp(k, 0, 1));
      topY[x] = baseY[x] - lerp(lo.h, hi.h, clamp(k, 0, 1));
    }
  }
  let minTop = 1e9;
  for (let x = 0; x <= W; x++) minTop = Math.min(minTop, topY[x]);

  // ── sky ─────────────────────────────────────────────────────────────────
  for (let i = 0; i < minTop; i++){
    const f = i / Math.max(1, minTop);
    R(0, i, W, 1, night ? `rgb(${6 + f * 13 | 0},${10 + f * 20 | 0},${26 + f * 26 | 0})`
                        : `rgb(${92 + f * 80 | 0},${150 + f * 66 | 0},${210 + f * 30 | 0})`);
  }
  if (night) for (let i = 0; i < 30; i++)
    R((i * 61 + 7) % W, (i * 11) % Math.max(4, minTop - 6), 1, 1, '#2c3a60');
  else for (let i = 0; i < 4; i++){
    const cx = (i * 113 + 50) % W, cy = 8 + (i * 9) % 14;
    for (let j = 0; j < 4; j++) R(cx + j * 7 - 10, cy + (j % 2), 12, 4, '#ffffff26');
  }
  [W * .17, W * .83].forEach(x => {                       // light towers over the stands
    R(x - 1, minTop - 20, 2, 20, night ? '#2a3040' : '#5a6472');
    R(x - 10, minTop - 26, 21, 6, night ? '#1d2330' : '#4c5663');
    for (let i = 0; i < 5; i++) R(x - 8 + i * 4, minTop - 25, 3, 3, night ? '#fff6c8' : '#aeb7c4');
    if (night) R(x - 12, minTop - 27, 25, 8, '#fff6c822');
  });

  // ── the stands, filled column by column down to the top of the wall ─────
  const standTop = Math.max(0, Math.floor(minTop) - 30);
  for (let x = 0; x <= W; x++){
    const top = topY[x];
    for (let y = standTop; y < top; y++){
      const f = (y - standTop) / Math.max(1, top - standTop);
      const row = Math.min(5, Math.floor(f * 6)), dim = .12 + row * .11;
      const b = night ? [19, 22, 32] : [74, 80, 95];
      R(x, y, 1, 1, `rgb(${b[0] * (1 - dim * .5) | 0},${b[1] * (1 - dim * .5) | 0},${b[2] * (1 - dim * .5) | 0})`);
      if (row === 2 && y % 3 === 0) R(x, y, 1, 1, night ? '#2a3348' : '#9aa3b4');   // the rail between decks
    }
  }

  // the people: a loose grid of little heads and shoulders
  for (let x = 1; x < W; x += 3){
    const top = topY[x];
    for (let y = standTop + 1; y < top - 1; y += 3){
      if (((x / 3 | 0) % 14) === 0) continue;                       // leave the aisles empty
      const f = (y - standTop) / Math.max(1, top - standTop);
      const c = CROWD[Math.abs((x * 7 + Math.round(y) * 13)) % CROWD.length];
      const lit = night ? mix(c, '#141a28', .50) : mix(c, '#20273a', .18 + f * .26);
      const bob = park.excite > 0 && Math.sin(t / 70 + x * .7) > .3 ? 1 : 0;
      R(x, y - bob, 2, 2, lit);
      R(x, y + 2 - bob, 2, 1, night ? '#0e1220' : mix(c, '#000000', .62));
    }
  }

  // ── the wall ────────────────────────────────────────────────────────────
  for (let x = 0; x <= W; x++){
    const top = topY[x], bot = baseY[x];
    R(x, top, 1, Math.max(1, bot - top), park.wall);
    R(x, top, 1, 2, shade(park.wall, .3));
    R(x, bot - 2, 1, 2, shade(park.wall, -.34));
    if (park.pad && x % 26 < 1) R(x, top + 3, 1, Math.max(1, bot - top - 5), shade(park.wall, -.2));
    if (park.feature === 'ivy' && x % 3 !== 2)
      for (let y = top + 2; y < bot - 1; y += 2) R(x, y, 1, 2, mix('#1f5a2a', '#000000', (x % 9) / 24));
  }
  const mark = (ang, n) => {
    const p = atAng(ang, wallDist(ang)), d = String(n).split('');
    const cx = clamp(p.x | 0, 0, W);
    const x0 = Math.round(p.x - d.length * 2.5), y0 = Math.round((topY[cx] + baseY[cx]) / 2 - 3);
    d.forEach((c, i) => NUM[c].forEach(([dx, dy, w2, h2]) => R(x0 + i * 5 + dx, y0 + dy, w2 || 1, h2 || 1, '#e8e4d6')));
  };
  mark(-38, park.lf); mark(-12, park.cf); mark(38, park.rf);
  if (park.feature === 'scoreboard'){
    const p = atAng(16, wallDist(16)), bw = 78, bh = 30, cx = clamp(p.x | 0, 0, W);
    const bx = Math.round(p.x - bw / 2), by = Math.round(topY[cx] - bh);
    R(bx, by, bw, bh, '#0d1119'); R(bx + 2, by + 2, bw - 4, bh - 4, night ? '#121a2c' : '#1b2436');
    for (let i = 0; i < 7; i++) for (let j = 0; j < 3; j++)
      R(bx + 5 + i * 10, by + 5 + j * 8, 7, 6, ((i * 3 + j) % 4) ? (night ? '#1d2740' : '#263048') : (night ? '#ffcf4a' : '#d8b24a'));
  }
  if (park.feature === 'waterfall'){
    const p = atAng(24, wallDist(24)), cx = clamp(p.x | 0, 0, W);
    const bx = Math.round(p.x), by = Math.round(topY[cx]);
    for (let i = 0; i < 6; i++) R(bx - 22 + i * 8, by - 15, 6, 17 + (i % 3) * 4, mix('#5fc8e8', '#ffffff', (i % 2) * .3));
    R(bx - 24, by - 3, 48, 4, '#8fe3ff');
  }

  // ── warning track and grass, from the foot of the wall down ─────────────
  for (let x = 0; x <= W; x++){
    const bot = Math.round(baseY[x]);
    for (let i = 0; i < 5; i++) R(x, bot + i, 1, 1, i < 4 ? '#8f6240' : '#7d5435');
    for (let y = bot + 5; y < H; y++){
      const f = (y - bot) / Math.max(1, H - bot);
      R(x, y, 1, 1, ((y / 8) | 0) % 2 ? `rgb(${32 + f * 24 | 0},${94 + f * 42 | 0},${38 + f * 18 | 0})`
                                      : `rgb(${38 + f * 27 | 0},${108 + f * 46 | 0},${44 + f * 21 | 0})`);
    }
  }

  // ── the infield ─────────────────────────────────────────────────────────
  const HP = proj(0, 0);
  g.fillStyle = '#b07a4e'; g.beginPath(); g.moveTo(HP.x, HP.y + 12);
  for (let a = -48; a <= 48; a += 2){ const q = atAng(a, 97); g.lineTo(q.x, q.y); }
  g.closePath(); g.fill();
  g.fillStyle = '#bd855a'; g.beginPath(); g.moveTo(HP.x, HP.y + 12);
  for (let a = -48; a <= 48; a += 2){ const q = atAng(a, 72); g.lineTo(q.x, q.y); }
  g.closePath(); g.fill();
  const B1 = atAng(45, 90), B2 = atAng(0, 127), B3 = atAng(-45, 90);
  g.fillStyle = '#3aa44c'; g.beginPath();
  g.moveTo(HP.x, HP.y + 4); g.lineTo(B1.x, B1.y); g.lineTo(B2.x, B2.y); g.lineTo(B3.x, B3.y);
  g.closePath(); g.fill();
  const path = (A, B) => { g.strokeStyle = '#b07a4e'; g.lineWidth = Math.max(2, 6 * A.s);
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke(); };
  path(HP, B1); path(B1, B2); path(B2, B3); path(B3, HP);
  // the dirt around home plate
  g.fillStyle = '#bd855a'; g.beginPath(); g.ellipse(HP.x, HP.y + 3, 58, 21, 0, 0, 7); g.fill();
  g.fillStyle = '#b07a4e'; g.beginPath(); g.ellipse(HP.x, HP.y + 10, 58, 15, 0, 0, 7); g.fill();

  const M0 = proj(60.5, 0), mr = Math.max(9, 18 * M0.s * PK / 2);
  g.fillStyle = '#bd855a'; g.beginPath(); g.ellipse(M0.x, M0.y + 2, mr, mr * .40, 0, 0, 7); g.fill();
  g.fillStyle = '#a97245'; g.beginPath(); g.ellipse(M0.x, M0.y + mr * .22, mr, mr * .3, 0, 0, 7); g.fill();
  R(Math.round(M0.x - 4), Math.round(M0.y - 2), 8, 2, '#eee8dd');

  g.strokeStyle = '#f2efe6'; g.lineWidth = 1;
  [-45, 45].forEach(a => { const far = atAng(a, wallDist(a));
    g.beginPath(); g.moveTo(HP.x, HP.y + 4); g.lineTo(far.x, far.y); g.stroke(); });
  [B1, B2, B3].forEach(bs => { const s2 = Math.max(3, 8 * bs.s);
    R(bs.x - s2 / 2, bs.y - s2 / 3, s2, s2 * .6, '#f4f1e8');
    R(bs.x - s2 / 2, bs.y + s2 * .27 - s2 / 3, s2, 1, '#c9c4b4'); });

  g.strokeStyle = '#a97245'; g.lineWidth = 1;
  g.beginPath(); g.ellipse(HP.x, HP.y + 3, 56, 20, 0, Math.PI, 0); g.stroke();
  g.strokeStyle = '#ffffff44';
  g.strokeRect(HP.x - 42.5, HP.y - 9.5, 26, 24); g.strokeRect(HP.x + 16.5, HP.y - 9.5, 26, 24);
  g.fillStyle = '#f4f1e8'; g.beginPath();
  g.moveTo(HP.x - 10, HP.y - 1); g.lineTo(HP.x + 10, HP.y - 1);
  g.lineTo(HP.x + 10, HP.y + 3); g.lineTo(HP.x, HP.y + 7); g.lineTo(HP.x - 10, HP.y + 3);
  g.closePath(); g.fill();
}

// the seven fielders standing out there, small and in perspective
function drawFielders(team){
  FIELDERS.forEach(([d, lat], i) => {
    const p = proj(d, lat);
    drawMini(p.x, p.y, (team.lineup[i] || team.lineup[0]).look, team.c1, team.c2, p.s * 2.4);
  });
}

// ───────────────────────────────────────────────────────────────────────────
//  GAME (one nine-inning game)
// ───────────────────────────────────────────────────────────────────────────
const ZONE = { x: 190, y: 160, w: 40, h: 34 };                 // right over the plate (x set in fit())
const PITCHES = { FB:{ n:'Fastball', mph:[90,102], br:[0,0],     col:'#ff6b5a' },
                  CV:{ n:'Curve',    mph:[74,84],  br:[0,22],    col:'#5ad2ff' },
                  SL:{ n:'Slider',   mph:[82,90],  br:[-20,8],   col:'#c48bff' },
                  CH:{ n:'Change',   mph:[78,86],  br:[4,10],    col:'#8ef08a' } };

addEventListener('resize', fit); fit();
let M = null;                                      // the match in progress

function startGame(oppIdx, home, opts = {}){
  const me = myTeam(), opp = G.teams[oppIdx];
  M = {
    home: home ? me : opp, away: home ? opp : me, meHome: home,
    inning:1, top:true, outs:0, bases:[null,null,null], score:{ home:0, away:0 },
    balls:0, strikes:0, lineHome:0, lineAway:0,
    pitcherHome: home ? me.rot[G.rotIdx % 5] : opp.rot[ri(0,4)],
    pitcherAway: home ? opp.rot[ri(0,4)] : me.rot[G.rotIdx % 5],
    pcHome:0, pcAway:0, line:[], mode: opts.mode || 'full',       // full | offense | defense
    park: makePark(home ? me : opp), msg:null, msgT:0, over:false, exc:0,
  };
  M.pitcherHome.st.ip = M.pitcherHome.st.ip || 0;
  phase = 'atbat'; setupAtBat();
}
function makePark(team){
  const kinds = [
    { wall:'#1f5a2a', wallH:26, feature:'ivy',        pad:0, lf:300, cf:400, rf:330 },
    { wall:'#1c6e4a', wallH:34, feature:'none',       pad:1, lf:310, cf:390, rf:302 },   // tall left wall
    { wall:'#17324f', wallH:20, feature:'scoreboard', pad:1, lf:330, cf:410, rf:318 },
    { wall:'#2a4a6a', wallH:22, feature:'waterfall',  pad:1, lf:322, cf:404, rf:322 },
    { wall:'#3a2a2a', wallH:18, feature:'none',       pad:1, lf:295, cf:396, rf:314 },   // short porch
  ];
  const k = kinds[Math.abs(team.ab.charCodeAt(0) + team.ab.charCodeAt(1)) % kinds.length];
  return { ...k, night: (team.ab.charCodeAt(0) % 2) === 0, excite:0 };
}

const batTeam = () => M.top ? M.away : M.home;
const fldTeam = () => M.top ? M.home : M.away;
const curPitcher = () => M.top ? M.pitcherHome : M.pitcherAway;
const weBat = () => (M.top && !M.meHome) || (!M.top && M.meHome);
// who is actually played by the user right now
const userBats = () => weBat() && (M.mode === 'full' || M.mode === 'offense');
const userPitches = () => !weBat() && (M.mode === 'full' || M.mode === 'defense');

function lineupOf(team){ return team.lineup; }
function batterIdx(team){ team._bi = team._bi || 0; return team._bi; }
function curBatter(){ const t = batTeam(); return t.lineup[batterIdx(t) % 9]; }
function nextBatter(){ const t = batTeam(); t._bi = (batterIdx(t) + 1) % 9; }

// ── one pitch ──────────────────────────────────────────────────────────────
let P = null;        // the pitch in the air
let phase = 'menu';  // menu | atbat | pitching | flight | play | between | over
let swing = null;

const PITCH_GAP = 5000;         // five seconds from one pitch to the next
function setupAtBat(){
  M.balls = 0; M.strikes = 0;
  M.batter = curBatter();
  M.catcher = fldTeam().lineup[0];
  // the two cards face off first; tap to step in
  if (M.mode !== 'sim' && (userBats() || userPitches())){ phase = 'matchup'; P = null; swing = null; return; }
  nextPitch();
}
function fatigue(){
  const p = curPitcher(), pc = M.top ? M.pcHome : M.pcAway;
  const cap = 40 + (p.stamina - 60) * 1.6;              // ~40 pitches at 60 stamina, ~135 at 120
  return clamp(pc / cap, 0, 1.8);
}
// how tight the pitcher can hit a spot: great control = about a twentieth of the zone,
// poor control = about a third of it, and tiredness widens it
function spread(p){
  const base = lerp(34, 7, clamp((p.control - 60) / 60, 0, 1));
  return base * (1 + fatigue() * .55);
}
function nextPitch(){
  P = { t:0, thrown:false, type:'FB', tx:0, ty:0, br:[0,0], dur:1, result:null, mph:0,
        windup:0, ready:0, caught:0 };
  swing = null;
  if (userPitches()) phase = 'pitching';
  else { phase = 'atbat'; }          // the computer winds up first, then throws
}
// the computer picks a pitch and a spot: mostly strikes, more care against good hitters
function aiPitch(){
  const p = curPitcher(), b = M.batter;
  const keys = Object.keys(p.pitches);
  const type = M.strikes === 2 && chance(.55) ? pick(keys.filter(k => k !== 'FB').concat(['FB'])) : pick(keys);
  // 60% strikes, fewer against dangerous hitters, more when behind in the count
  let sp = .6 - clamp((b.ovr - 85) / 100, 0, .18) + (M.balls >= 2 ? .18 : 0) - (M.strikes === 2 ? .12 : 0);
  const strike = chance(clamp(sp, .3, .9));
  const ax = strike ? rnd(.8, -.8) : (chance(.5) ? rnd(1.9, 1.15) : rnd(-1.15, -1.9));
  const ay = strike ? rnd(.8, -.8) : (chance(.5) ? rnd(1.8, 1.15) : rnd(-1.15, -1.8));
  throwPitch(type, ax, ay);
}
// aim is in zone units: -1..1 is inside the strike zone
function throwPitch(type, ax, ay){
  const p = curPitcher(), info = PITCHES[type], q = p.pitches[type] || 70;
  const s = spread(p) / 26;                                 // turn pixels into zone units
  // aiming at a corner with a bad pitcher is much worse than aiming down the middle
  const edge = clamp((Math.abs(ax) + Math.abs(ay)) / 2, 0, 1.4);
  const miss = s * (1 + edge * 1.1);
  P.type = type;
  P.tx = ax + (bell() - .5) * 2 * miss;
  P.ty = ay + (bell() - .5) * 2 * miss;
  P.mph = Math.round(lerp(info.mph[0], info.mph[1], clamp((p.velocity - 60) / 60, 0, 1)) - fatigue() * 3);
  P.dur = lerp(1260, 820, clamp((P.mph - 72) / 32, 0, 1));  // ms from hand to plate
  P.br = [info.br[0] * lerp(.6, 1.3, (q - 60) / 60), info.br[1] * lerp(.6, 1.3, (q - 60) / 60)];
  P.quality = q;
  P.thrown = true; P.t = 0; P.windup = 420;
  if (M.top) M.pcHome++; else M.pcAway++;
}

// where the ball is on screen at time f (0 = hand, 1 = plate)
function ballAt(f){
  const e = f * f;                                           // it comes at you, so it speeds up on screen
  const rel = releasePt();
  const tx = ZONE.x + ZONE.w / 2 + P.tx * ZONE.w / 2, ty = ZONE.y + ZONE.h / 2 + P.ty * ZONE.h / 2;
  return { x: lerp(rel.x, tx + P.br[0] * e, e), y: lerp(rel.y, ty + P.br[1] * e, e), r: lerp(1, 5, e) };
}
// where the ball leaves his hand, out at the mound
function releasePt(){ const m = proj(60.5, 0); return { x: m.x + 5, y: m.y - 22 }; }
// the catcher's mitt, just under the zone
const mittPt = () => ({ x: ZONE.x + ZONE.w / 2 - 12, y: ZONE.y + ZONE.h + 14 });
const inZone = () => Math.abs(P.tx) <= 1 && Math.abs(P.ty) <= 1;

// ── swinging ───────────────────────────────────────────────────────────────
function doSwing(){
  if (!P || !P.thrown || swing || P.result) return;
  const f = P.t / P.dur;
  swing = { f, t:0 };
  resolveSwing(f);
}
function resolveSwing(f){
  const b = M.batter;
  const err = Math.abs(f - 1) * P.dur;                       // ms away from perfect
  const win = lerp(90, 165, clamp((b.contact - 60) / 60, 0, 1));   // the good-timing window
  const far = Math.abs(P.tx) > 1.35 || Math.abs(P.ty) > 1.35;      // way off the plate
  if (err > win * 1.9 || (far && err > win * .7)){ P.result = 'swingmiss'; return finishPitch(); }
  const qual = clamp(1 - err / (win * 1.35), 0, 1) * (far ? .45 : 1) * lerp(.75, 1, clamp((b.contact - 60) / 60, 0, 1));
  if (qual < .22 || chance(.1 - qual * .08)){ P.result = 'foul'; return finishPitch(); }
  P.result = 'hit';
  contact(qual, f);
}
// turn the swing into a ball in play
function contact(qual, f){
  const b = M.batter;
  // early swing pulls the ball, late swing goes the other way
  const pull = clamp((1 - f) * 5, -1, 1) * (b.bats === 'L' ? -1 : 1);
  const angleDeg = clamp(pull * 40 + (bell() - .5) * 26, -46, 46);      // -45 = left line, +45 = right line
  // launch angle: good contact gives line drives
  const la = lerp(-12, 42, bell()) + qual * 10 - (P.ty > .4 ? 8 : 0);
  // distance: power matters but it is a roll of the dice, so a weak hitter can still go deep
  const pw = clamp((b.power - 60) / 60, 0, 1);
  const roll = bell() * .55 + Math.random() * .45;
  const ev = lerp(58, 108, clamp(qual * .55 + pw * .3 + roll * .35, 0, 1));
  const dist = ev * ev / 24 * clamp(Math.cos((la - 28) * Math.PI / 110), .35, 1) * lerp(.9, 1.12, qual);
  P.ball = { angle: angleDeg, la, ev, dist, qual };
  playBall();
}

// ── what happens to a ball in play ─────────────────────────────────────────
function wallDist(angle){
  const p = M.park, a = clamp(angle, -45, 45);
  return a < 0 ? lerp(p.lf, p.cf, (a + 45) / 45) : lerp(p.cf, p.rf, a / 45);
}
function playBall(){
  const bb = P.ball, b = M.batter, f = fldTeam();
  const need = wallDist(bb.angle);
  const fld = f.lineup.reduce((s, p) => s + p.fielding, 0) / 9;
  const spd = clamp((b.speed - 60) / 60, 0, 1);
  let res;
  if (bb.la < 8){                                             // ground ball
    const through = clamp(.30 + bb.ev / 300 - (fld - 85) / 300 + spd * .07, .1, .62);
    if (chance(.04 + (110 - fld) / 900)) res = 'error';
    else if (chance(through)) res = chance(.08 + spd * .08) ? 'double' : 'single';
    else if (M.bases[0] && M.outs < 2 && chance(.42)) res = 'dp';
    else res = 'groundout';
  } else if (bb.la > 36 || bb.ev < 72){                       // fly ball or pop up
    if (bb.dist > need && bb.la > 15 && bb.la < 44) res = 'hr';
    else if (bb.dist > need * .86 && chance(.38)) res = chance(.4) ? 'triple' : 'double';
    else if (bb.dist > need * .72 && chance(.26)) res = 'single';
    else res = 'flyout';
  } else {                                                    // line drive
    if (bb.dist > need && bb.la > 15) res = 'hr';
    else if (bb.dist > need * .92 && chance(.5)) res = chance(.3) ? 'triple' : 'double';
    else if (chance(.62 - (fld - 85) / 400)) res = chance(.26) ? 'double' : 'single';
    else res = 'lineout';
  }
  P.play = res;
  phase = 'play'; P.playT = 0;
}

// ── applying the result ────────────────────────────────────────────────────
function advance(n, batterSafe = true, rbiCap = 9){
  // move every runner up n bases; anybody past third scores
  let runs = 0;
  const b = M.bases;
  for (let i = 2; i >= 0; i--){
    if (!b[i]) continue;
    const to = i + n;
    if (to >= 3){ runs++; score(b[i]); b[i] = null; }
    else { b[to] = b[i]; b[i] = null; }
  }
  if (batterSafe){ if (n - 1 >= 3){ runs++; score(M.batter); } else b[n - 1] = M.batter; }
  return runs;
}
function score(p){
  if (M.top) M.score.away++; else M.score.home++;
  p.st.r++;
  M.exc = 1;
}
function applyPlay(res){
  const b = M.batter, st = b.st, p = curPitcher();
  let runs = 0, out = 0, txt = '';
  st.pa++;
  switch(res){
    case 'hr': { st.ab++; st.h++; st.hr++; const before = M.bases.filter(Boolean).length;
      runs = advance(4); st.rbi += before + 1; txt = before === 3 ? 'GRAND SLAM!' : 'GONE!'; M.exc = 1.4; break; }
    case 'triple': st.ab++; st.h++; runs = advance(3); st.rbi += runs; txt = 'TRIPLE!'; M.exc = 1; break;
    case 'double': { st.ab++; st.h++;
      // a runner on first usually scores on a double, more often if he can run
      const r1 = M.bases[0];
      if (r1 && chance(.45 + clamp((r1.speed - 85) / 300, -.1, .12))){ score(r1); M.bases[0] = null; runs++; }
      runs += advance(2); st.rbi += runs; txt = 'DOUBLE!'; M.exc = .8; break; }
    case 'single': { st.ab++; st.h++;
      // a runner on second often scores on a single, and sometimes first to third
      const r2 = M.bases[1];
      if (r2 && chance(.55 + clamp((r2.speed - 85) / 300, -.12, .15))){ score(r2); M.bases[1] = null; runs++; }
      else if (M.bases[0] && !M.bases[1] && chance(.28)){ M.bases[1] = M.bases[0]; M.bases[0] = null; }
      runs += advance(1); st.rbi += runs; txt = 'BASE HIT'; M.exc = .6; break; }
    case 'error':  st.ab++; runs = advance(1); txt = 'ERROR!'; break;
    case 'dp':     st.ab++; out = 2; M.bases[0] = null; txt = 'DOUBLE PLAY'; break;
    case 'groundout': case 'flyout': case 'lineout':
      st.ab++; out = 1;
      if (res === 'flyout' && M.bases[2] && M.outs < 2 && chance(.55)){ runs += advance(1, false); st.rbi += runs; txt = 'SAC FLY'; }
      else txt = res === 'groundout' ? 'GROUND OUT' : res === 'flyout' ? 'FLY OUT' : 'LINE OUT';
      break;
    case 'k':   st.ab++; st.k++; p.st.ko++; out = 1; txt = 'STRIKE THREE!'; break;
    case 'bb':  st.bb++; { const forced = M.bases[0] && (!M.bases[1] || M.bases[2] !== null);
      runs = walkAdvance(); } txt = 'WALK'; break;
    case 'hbp': runs = walkAdvance(); txt = 'HIT BY PITCH'; break;
  }
  if (runs) p.st.er += runs;
  M.outs += out;
  say(txt);
  if (weBat()) G.coins += ({ single:25, double:40, triple:75, hr:200 })[res] || 0;
  if (!weBat() && res === 'k') G.coins += 30;
  nextBatter();
  if (M.outs >= 3) endHalf(); else setupAtBat();
}
function walkAdvance(){
  // the batter takes first; runners only move when they are forced
  const b = M.bases; let runs = 0;
  if (!b[0]) { b[0] = M.batter; return 0; }
  if (!b[1]) { b[1] = b[0]; b[0] = M.batter; return 0; }
  if (!b[2]) { b[2] = b[1]; b[1] = b[0]; b[0] = M.batter; return 0; }
  score(b[2]); b[2] = b[1]; b[1] = b[0]; b[0] = M.batter; return 1;
}
function say(t){ M.msg = t; M.msgT = 0; }
function finishPitch(){
  if (P.result === 'ball'){ M.balls++; if (M.balls >= 4) return applyPlay('bb'); }
  else if (P.result === 'swingmiss' || P.result === 'called'){ M.strikes++; if (M.strikes >= 3) return applyPlay('k'); }
  else if (P.result === 'foul'){ if (M.strikes < 2) M.strikes++; }
  P.done = true; P.waitT = 0;
}
function endHalf(){
  const p = curPitcher(); p.st.ip += 1;
  M.outs = 0; M.bases = [null,null,null];
  if (!M.top){ M.inning++; }
  M.top = !M.top;
  // game over?
  const i = M.inning, s = M.score;
  const mercy = i > 7 && Math.abs(s.home - s.away) >= 10;
  if (mercy || (i > 9 && s.home !== s.away) || (i >= 9 && !M.top && s.home > s.away)) return gameOver();
  setupAtBat();
}
function gameOver(){
  M.over = true; phase = 'over';
  const me = myTeam(), myRuns = M.meHome ? M.score.home : M.score.away, oth = M.meHome ? M.score.away : M.score.home;
  const won = myRuns > oth;
  me[won ? 'w' : 'l']++; me.rs += myRuns; me.ra += oth;
  G.coins += won ? 500 : 120;
  if (!M.meHome ? M.score.home === 0 : M.score.away === 0) G.coins += 500;      // shutout
  const sg = G.sched[G.day]; if (sg){ sg.done = true; sg.rs = myRuns; sg.ra = oth; }
  G.day++; G.rotIdx++;
  save();
}

let frame = 0;

function drawBatterView(dt){
  const park = M.park; park.excite = M.exc;
  drawField(park, frame);
  const ft = fldTeam(), bt = batTeam();
  drawFielders(ft);

  // ── the pitcher on the mound ────────────────────────────────────────────
  const pit = curPitcher(), M0 = proj(60.5, 0);
  let u = 0;
  if (P && P.thrown) u = clamp(.70 + (P.t / P.dur) * .44, 0, 1);
  else if (P) u = clamp((P.windup || 0) * .70, 0, .70);
  drawPitcher(M0.x, M0.y + 3, pit, ft.c1, ft.c2, u, .62);

  // ── the umpire, then the catcher crouched under the plate ───────────────
  const HP = proj(0, 0);
  drawUmp(HP.x - 2, H + 20, ft);
  drawCatcher(HP.x - 8, H + 4, M.catcher || ft.lineup[0], ft.c1, ft.c2);

  // ── the batter in the box ───────────────────────────────────────────────
  const b = M.batter, side = b.bats === 'L' ? 1 : -1;
  const bx = HP.x + side * 44;
  drawBatter(bx, HOME_Y + 20, b, bt.c1, bt.c2, swing ? clamp(swing.t / 220, 0, 1) : null, frame, b.num);

  // ── the strike zone, floating over the plate ────────────────────────────
  const live = P && (P.thrown || P.winding || phase === 'pitching');
  g.strokeStyle = live ? '#ffffff66' : '#ffffff33'; g.lineWidth = 1;
  g.strokeRect(ZONE.x + .5, ZONE.y + .5, ZONE.w, ZONE.h);
  [[ZONE.w/3,0],[ZONE.w*2/3,0]].forEach(([dx]) => {           // faint thirds, like a real zone grid
    g.strokeStyle = '#ffffff1e';
    g.beginPath(); g.moveTo(ZONE.x + dx + .5, ZONE.y); g.lineTo(ZONE.x + dx + .5, ZONE.y + ZONE.h); g.stroke(); });
  [[0,ZONE.h/3],[0,ZONE.h*2/3]].forEach(([, dy]) => {
    g.strokeStyle = '#ffffff1e';
    g.beginPath(); g.moveTo(ZONE.x, ZONE.y + dy + .5); g.lineTo(ZONE.x + ZONE.w, ZONE.y + dy + .5); g.stroke(); });

  // ── the ball ────────────────────────────────────────────────────────────
  if (P && P.thrown && P.t < P.dur && !P.hitAway){
    const f = P.t / P.dur, q = ballAt(f);
    for (let i = 1; i <= 4; i++){                              // a short trail reads as speed
      const o = ballAt(clamp(f - i * .045, 0, 1));
      R(o.x - o.r / 2, o.y - o.r / 2, o.r, o.r, `rgba(255,255,255,${.09 * (5 - i)})`);
    }
    g.fillStyle = '#fdfdf5'; g.beginPath(); g.arc(q.x, q.y, q.r, 0, 7); g.fill();
    if (q.r > 2.4) R(q.x - q.r, q.y - 1, q.r * 2, 1, '#d8342c');
  }
  // the catcher takes it: the ball carries on into his mitt with a little pop
  else if (P && P.caught > 0 && !P.hitAway){
    const k = clamp(1 - P.caught / 260, 0, 1), end = mittPt(), from = ballAt(1);
    const x = lerp(from.x, end.x, k), y = lerp(from.y, end.y, k);
    g.fillStyle = '#fdfdf5'; g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill();
    if (k > .9){ const pop = (k - .9) * 10;
      g.strokeStyle = `rgba(255,255,255,${(1 - pop) * .7})`; g.lineWidth = 1;
      g.beginPath(); g.arc(end.x, end.y, 4 + pop * 8, 0, 7); g.stroke(); }
  }

  drawHUD();
  if (M.msg) textb(M.msg, W / 2, 74, M.msg.includes('!') ? '#ffd23f' : '#fff', 14, 'center');
}

// ── a ball in play, on the same field you are looking at ──────────────────
// The ball arcs out, a fielder breaks on it, and you see the catch, the hop,
// or the ball clearing the wall. No separate top-down screen.
function playFielder(bb){
  // whoever is closest to where the ball is going breaks on it
  let best = 0, bd = 1e9;
  FIELDERS.forEach(([d, lat], i) => {
    const ang = Math.atan2(lat, d) * 180 / Math.PI, dist = Math.hypot(d, lat);
    const miss = Math.abs(ang - bb.angle) * 2.2 + Math.abs(dist - bb.dist) * .35;
    if (miss < bd){ bd = miss; best = i; }
  });
  return best;
}
function drawPlay(t){
  const bb = P.ball, park = M.park;
  park.excite = M.exc;
  drawField(park, frame);
  const ft = fldTeam(), bt = batTeam();

  const f = clamp(t / 1700, 0, 1);
  const flight = clamp(t / 950, 0, 1);              // how far along its flight the ball is
  const need = wallDist(bb.angle), gone = P.play === 'hr';
  const travel = bb.dist * (gone ? Math.min(1, flight * 1.25) : flight);
  const r = bb.angle * Math.PI / 180;
  const land = proj(travel * Math.cos(r), travel * Math.sin(r));
  // the arc: how high it is above the ground, in screen pixels
  const hop = Math.sin(flight * Math.PI) * clamp(bb.la, 2, 45) * 1.5 * land.s * 2.2;

  // the fielders, with the one on the ball running to meet it
  const who = playFielder(bb);
  FIELDERS.forEach(([d, lat], i) => {
    let px, py, ps;
    if (i === who && !gone){
      const k = ease(clamp(flight * 1.15, 0, 1));
      const td = lerp(d, travel * Math.cos(r), k), tl = lerp(lat, travel * Math.sin(r), k);
      const q = proj(td, tl); px = q.x; py = q.y; ps = q.s;
    } else { const q = proj(d, lat); px = q.x; py = q.y; ps = q.s; }
    drawMini(px, py, (ft.lineup[i] || ft.lineup[0]).look, ft.c1, ft.c2, ps * 2.4);
  });

  // the batter running up the line once he has hit it
  if (!gone || f > .4){
    const run = clamp((t - 180) / 1400, 0, 1);
    const rp = proj(90 * run * .72, 90 * run * .72);
    drawMini(rp.x, rp.y, M.batter.look, bt.c1, bt.c2, rp.s * 2.6);
  }
  // and anybody who was already on base
  M.bases.forEach((p2, i) => { if (!p2) return;
    const base = [atAng(45, 90), atAng(0, 127), atAng(-45, 90)][i];
    drawMini(base.x, base.y - 2, p2.look, bt.c1, bt.c2, base.s * 2.4); });

  // the ball, with a shadow on the grass under it
  if (flight < 1 || gone){
    R(land.x - 2, land.y - 1, 4, 2, '#00000044');
    const br = Math.max(1.5, 4 * land.s * 2.2);
    g.fillStyle = '#fdfdf5';
    g.beginPath(); g.arc(land.x, land.y - hop, br, 0, 7); g.fill();
  }
  // how hard it was hit
  textb(`${Math.round(bb.ev)} MPH   ${Math.round(bb.dist)} FT`, W / 2, 22, '#d6dcea', 8, 'center');
  if (gone && flight > .75){
    textb('GONE!', W / 2, 46, '#ffd23f', 22, 'center');
    // a few sparks over the wall
    for (let i = 0; i < 8; i++){ const a2 = i * .8 + t / 90;
      R(land.x + Math.cos(a2) * (14 + i * 3), land.y - hop + Math.sin(a2) * (10 + i * 2), 2, 2, i % 2 ? '#ffd23f' : '#fff'); }
  } else if (M.msg && t > 380) textb(M.msg, W / 2, 46, '#ffd23f', 17, 'center');
  drawHUD();
}

//  MENUS
