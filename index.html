/* ═══════════════════════════════════════════════════════════════════════════
   CARDS, PACKS AND UPGRADES
   Every player you own is a card. Packs come in four tiers, each card is
   revealed by tapping it, and the longer it spins the better it is.
   ═══════════════════════════════════════════════════════════════════════════ */
const CARD_W = 60, CARD_H = 100;                 // a card's size in game pixels
const PACKS = {
  bronze:  { n:'Bronze',  price:1000,  col:'#b07a46', col2:'#e0a86a', p:[.55,.30,.12,.025,.004,.001] },
  silver:  { n:'Silver',  price:3000,  col:'#8d97a8', col2:'#d2dae6', p:[.30,.35,.25,.080,.017,.003] },
  gold:    { n:'Gold',    price:8000,  col:'#b8902c', col2:'#ffd964', p:[.12,.25,.35,.220,.050,.010] },
  diamond: { n:'Diamond', price:20000, col:'#49a7c8', col2:'#b6f0ff', p:[.02,.10,.28,.400,.160,.040] },
};
const BULK = [[1, 1], [5, .9], [10, .8]];        // buy 5 for 10% off, 10 for 20% off
const TIER_LO = [60, 70, 80, 90, 100, 110], TIER_HI = [69, 79, 89, 99, 109, 120];
const UP_COST = [300, 500, 700, 1000, 1300, 1700, 2100, 2600, 3100, 3700];

let _cardId = 1;
const cardById = id => G.cards.find(c => c.id === id);
const ovrOf = c => c.pos === 'SP' || c.pos === 'RP' || c.pos === 'CP'
  ? Math.round((c.velocity + c.control + c.stamina + c.batting) / 4)
  : Math.round((c.contact + c.power + c.speed + c.fielding) / 4);
const isPitcher = c => ['SP','RP','CP'].includes(c.pos);
const statsOf = c => isPitcher(c)
  ? [['VEL','velocity'], ['CTL','control'], ['STA','stamina'], ['BAT','batting']]
  : [['CON','contact'], ['POW','power'], ['SPD','speed'], ['FLD','fielding']];
const sellPrice = c => Math.round(Math.pow(Math.max(0, ovrOf(c) - 55), 2) * 1.1);
const inUse = id => G.slots.lineup.includes(id) || G.slots.rot.includes(id) || G.slots.pen.includes(id);

// roll one card out of a pack
function rollCard(packKey){
  const p = PACKS[packKey].p;
  let r = Math.random(), a = 0, tier = 0;
  for (let i = 0; i < 6; i++){ a += p[i]; if (r < a){ tier = i; break; } }
  const lvl = TIER_LO[tier] + Math.floor(Math.random() * (TIER_HI[tier] - TIER_LO[tier] + 1));
  // a quarter of the cards are pitchers, as on a real roster
  const c = chance(.26) ? makePitcher(lvl, pick(['SP','SP','SP','RP','RP','CP']))
                        : makeHitter(lvl, pick(POS));
  // the rolled number is the card's headline rating, so the overall lands on it
  const keys = statsOf(c).map(s => s[1]);
  const cur = ovrOf(c), d = lvl - cur;
  keys.forEach(k => c[k] = clamp(c[k] + d, 60, 120));
  c.id = _cardId++; c.lvl = 0; c.ovr = ovrOf(c); c.num = ri(1, 72);
  return c;
}

// ── card art ───────────────────────────────────────────────────────────────
// a big portrait of the player, built with the same rig as the game sprites
function cardArt(c, team){
  const key = `A${lookKey(c.look)}|${team.c1}${team.c2}|${c.pos}|${c.num}`;
  return sprite(key, () => {
    const batting = !isPitcher(c);
    return buildPlayer(batting
      ? { crouch:0, lean:-1,
          hip:[54,56], chest:[55,34], neck:[55,27], head:[56,16],
          nSh:[50,31], fSh:[59,30],
          nEl:[46,39], nHa:[44,26], fEl:[49,41], fHa:[46,28],
          nKn:[48,76], nAn:[45,99], fKn:[62,75], fAn:[66,99], batA:-100, helmet:1 }
      : { crouch:1, lean:-2,
          hip:[55,56], chest:[56,34], neck:[56,27], head:[56,16],
          nSh:[49,30], fSh:[63,30],
          nEl:[50,43], nHa:[52,34], fEl:[62,42], fHa:[58,33],
          nKn:[50,76], nAn:[48,99], fKn:[62,76], fAn:[64,99], gloveA:170, front:1 },
      c.look, team.c1, team.c2, { number:c.num, front:!batting, helmet:batting });
  });
}

// the frame around a card: plain at the bottom tier, holo and sparkling at the top
function drawCard(x, y, c, w = CARD_W, h = CARD_H, t = 0, o = {}){
  const ovr = ovrOf(c), ti = clamp(Math.floor((ovr - 60) / 10), 0, 5), tc = TIERS[ti].col;
  const team = G.teams[G.team];
  const k = w / CARD_W;
  // backing
  R(x, y, w, h, '#0c1019');
  const bg1 = mix(tc, '#0b1018', ti >= 3 ? .62 : .76), bg2 = mix(tc, '#0b1018', ti >= 3 ? .40 : .60);
  for (let i = 0; i < h - 4 * k; i++) R(x + 2 * k, y + 2 * k + i, w - 4 * k, 1, mix(bg1, bg2, i / h));
  // the shine that sweeps across orange and red cards
  if (ti >= 4){
    const sw = ((t / 14 + x) % (w + 40)) - 20;
    for (let i = 0; i < 14; i++){
      const xx = x + sw + i, a = Math.sin(i / 14 * Math.PI) * (ti === 5 ? .30 : .18);
      if (xx > x + 2 && xx < x + w - 2) R(xx, y + 2 * k, 1, h - 4 * k, `rgba(255,255,255,${a})`);
    }
  }
  // the player, clipped into the card
  g.save();
  g.beginPath(); g.rect(x + 2 * k, y + 2 * k, w - 4 * k, h - 4 * k); g.clip();
  const ak = (h * .72) / RH;
  g.drawImage(cardArt(c, team), Math.round(x + w / 2 - 56 * ak), Math.round(y + h * .20),
    Math.round(RW * ak), Math.round(RH * ak));
  g.restore();
  // frame: thicker and brighter the better the card
  const fw = ti >= 3 ? 2 : 1;
  for (let i = 0; i < fw; i++){
    const cc = ti === 0 ? '#8e97a8' : ti >= 4 ? mix(tc, '#ffffff', .25 + .2 * Math.sin(t / 220 + i)) : tc;
    g.strokeStyle = cc; g.lineWidth = 1;
    g.strokeRect(x + i + .5, y + i + .5, w - 1 - i * 2, h - 1 - i * 2);
  }
  if (ti >= 2){                                  // corner notches
    [[0,0],[1,0],[0,1],[1,1]].forEach(([cx, cy]) =>
      R(x + (cx ? w - 5 : 1), y + (cy ? h - 5 : 1), 4, 4, tc));
  }
  if (ti === 5){                                 // sparkles on a red card
    for (let i = 0; i < 5; i++){
      const a = (t / 280 + i * 1.7), sx = x + 5 + ((i * 29) % (w - 10)), sy = y + 6 + ((i * 41) % (h - 14));
      const s = (Math.sin(a) + 1) / 2;
      if (s > .55){ R(sx, sy, 1, 1, '#fff'); R(sx - 1, sy, 3, 1, `rgba(255,255,255,${s * .55})`);
        R(sx, sy - 1, 1, 3, `rgba(255,255,255,${s * .55})`); }
    }
  }
  // name along the top, rating bottom-left, position bottom-right
  R(x + 2 * k, y + 2 * k, w - 4 * k, 9 * k, '#0b1018cc');
  const nm = c.name.split(' ');
  textb(nm[nm.length - 1].slice(0, 10).toUpperCase(), x + w / 2, y + 3 * k, '#f2efe6', Math.round(7 * k), 'center');
  R(x + 2 * k, y + h - 13 * k, w - 4 * k, 11 * k, '#0b1018cc');
  textb(String(ovr), x + 5 * k, y + h - 12 * k, tc, Math.round(10 * k));
  textb(c.pos, x + w - 5 * k, y + h - 11 * k, '#b9c2d2', Math.round(7 * k), 'right');
  if (c.lvl) textb(`${c.lvl}/10`, x + w / 2 + 3 * k, y + h - 11 * k, '#7fd38f', Math.round(6 * k), 'center');
  if (o.badge) textb(o.badge, x + w / 2, y + h / 2 - 4, '#ffd23f', 8, 'center');
}

// the back of a card: the season's numbers
function drawCardBack(x, y, c, w, h){
  const ovr = ovrOf(c), ti = clamp(Math.floor((ovr - 60) / 10), 0, 5), tc = TIERS[ti].col;
  R(x, y, w, h, '#0c1019');
  for (let i = 0; i < h - 4; i++) R(x + 2, y + 2 + i, w - 4, 1, mix('#121a28', '#0b1018', i / h));
  g.strokeStyle = tc; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  textb(c.name, x + w / 2, y + 6, '#f2efe6', 8, 'center');
  const s = c.st || newStat();
  const rows = isPitcher(c)
    ? [['IP', s.ip], ['K', s.ko], ['ER', s.er], ['W-L', `${s.w}-${s.l}`]]
    : [['AB', s.ab], ['H', s.h], ['HR', s.hr], ['RBI', s.rbi],
       ['AVG', (s.ab ? s.h / s.ab : 0).toFixed(3).replace('0.', '.')]];
  rows.forEach((r, i) => {
    textb(r[0], x + 8, y + 22 + i * 12, '#8e97a8', 7);
    textb(String(r[1]), x + w - 8, y + 22 + i * 12, '#f2efe6', 7, 'right');
  });
}

// ── opening a pack ─────────────────────────────────────────────────────────
let OPEN = null;      // { cards, i, spin, t, done }
function buyPack(kind, n){
  const cost = Math.round(PACKS[kind].price * BULK.find(b => b[0] === n)[1] * n);
  if (G.coins < cost) return;
  G.coins -= cost;
  const cards = [];
  for (let i = 0; i < n * 3; i++) cards.push(rollCard(kind));
  OPEN = { kind, cards, i:0, t:0, spin:null, revealed:[] };
  menu = 'open'; save();
}
function freePack(){
  if (Date.now() < (G.freeAt || 0)) return;
  G.freeAt = Date.now() + 24 * 3600 * 1000;
  OPEN = { kind:'bronze', cards:[rollCard('bronze'), rollCard('bronze'), rollCard('bronze')], i:0, t:0, spin:null, revealed:[] };
  menu = 'open'; save();
}
// tapping the face-down card starts the spin; better cards spin more and faster
function revealNext(){
  if (!OPEN || OPEN.spin) return;
  const c = OPEN.cards[OPEN.i];
  if (!c) return;
  const ti = clamp(Math.floor((ovrOf(c) - 60) / 10), 0, 5);
  const turns = 4 + ti * 1.2;                                  // 4 spins for a dud, 10 for a red
  const dur = 1500 - ti * 90;                                  // and the great ones whip round faster
  OPEN.spin = { t:0, turns, dur, ti, flash:0 };
}
function openTick(dt){
  if (!OPEN) return;
  OPEN.t += dt;
  const sp = OPEN.spin;
  if (!sp) return;
  sp.t += dt;
  if (sp.t >= sp.dur && !sp.landed){
    sp.landed = true; sp.flash = 420;
    const c = OPEN.cards[OPEN.i];
    G.cards.push(c); OPEN.revealed.push(c); save();
  }
  if (sp.landed){
    sp.flash -= dt;
    if (sp.flash < -300){ OPEN.spin = null; OPEN.i++; if (OPEN.i >= OPEN.cards.length) OPEN.done = true; }
  }
}
function drawOpen(){
  btns = [];
  R(0, 0, W, H, '#070a10');
  const P2 = PACKS[OPEN.kind];
  textb(`${P2.n.toUpperCase()} PACK`, W / 2, 8, P2.col2, 9, 'center');
  textb(`${OPEN.i + (OPEN.spin ? 1 : 0)} / ${OPEN.cards.length}`, W / 2, 20, '#8e97a8', 7, 'center');

  // the cards already turned over, lined up along the bottom
  const shown = OPEN.revealed.slice(-10);
  shown.forEach((c, i) => {
    const w = 26, x = W / 2 - (shown.length * 29) / 2 + i * 29;
    drawCard(x, H - 48, c, w, 44, OPEN.t);
  });

  if (OPEN.done){
    textb('ALL YOURS', W / 2, H / 2 - 26, '#ffd23f', 16, 'center');
    button(W / 2 - 50, H / 2 + 2, 100, 20, 'DONE', () => { OPEN = null; menu = 'shop'; }, '#2f6fe0');
    return;
  }
  const cx = W / 2, cy = 112, sp = OPEN.spin;
  if (!sp){
    // face down, waiting for a tap
    const bob = Math.sin(OPEN.t / 300) * 2;
    const w = 72, h = 120;
    R(cx - w/2, cy - h/2 + bob, w, h, '#101726');
    g.strokeStyle = P2.col; g.lineWidth = 1; g.strokeRect(cx - w/2 + .5, cy - h/2 + bob + .5, w - 1, h - 1);
    R(cx - w/2 + 4, cy - h/2 + bob + 4, w - 8, h - 8, mix(P2.col, '#0b1018', .55));
    // a ball stitched on the back
    g.fillStyle = mix(P2.col2, '#0b1018', .25); g.beginPath(); g.arc(cx, cy + bob, 17, 0, 7); g.fill();
    g.fillStyle = '#0b1018'; g.beginPath(); g.arc(cx, cy + bob, 14, 0, 7); g.fill();
    g.fillStyle = P2.col2; g.beginPath(); g.arc(cx, cy + bob, 11, 0, 7); g.fill();
    R(cx - 11, cy + bob - 1, 22, 2, '#b8322f');
    textb('TAP TO REVEAL', cx, cy + h/2 + bob + 8, '#8e97a8', 8, 'center');
    btns.push({ x: cx - w/2, y: cy - h/2, w, h, fn: revealNext });
    return;
  }
  // the spin: the card turns edge-on over and over, faster near the end
  const f = clamp(sp.t / sp.dur, 0, 1);
  const eased = 1 - Math.pow(1 - f, 2.1);                       // slows down as it lands
  const ang = eased * sp.turns * Math.PI;
  const sx = Math.abs(Math.cos(ang));
  const w = 72, h = 120, tc = TIERS[sp.ti].col;
  // glow builds as the better cards spin
  if (sp.ti >= 3){
    const gl = f * (sp.ti - 2) / 3;
    for (let i = 6; i > 0; i--) R(cx - w/2 - i*2, cy - h/2 - i*2, w + i*4, h + i*4, `rgba(${sp.ti>=5?'255,77,77':sp.ti>=4?'255,147,48':'255,210,63'},${.05 * gl})`);
  }
  const cw = Math.max(2, Math.round(w * sx));
  if (sp.landed){
    // it lands: a flash in the card's colour, then the card itself
    const fl = clamp(sp.flash / 420, 0, 1);
    drawCard(cx - w/2, cy - h/2, OPEN.cards[OPEN.i], w, h, OPEN.t);
    if (fl > 0) R(cx - w/2 - 4, cy - h/2 - 4, w + 8, h + 8, mix(tc, '#ffffff', .5).replace('#', 'rgba').length ? `rgba(255,255,255,${fl * .5})` : '#fff');
    if (sp.flash <= 0) textb('TAP', cx, cy + h/2 + 10, '#8e97a8', 7, 'center');
    btns.push({ x:0, y:0, w:W, h:H, fn: () => { if (sp.flash < 260) sp.flash = -400; } });
  } else {
    const face = Math.cos(ang) > 0;                             // front or back of the card
    if (face) { g.save(); g.translate(cx, 0); g.scale(sx, 1); g.translate(-cx, 0);
      drawCard(cx - w/2, cy - h/2, OPEN.cards[OPEN.i], w, h, OPEN.t); g.restore(); }
    else { R(cx - cw/2, cy - h/2, cw, h, mix(P2.col, '#0b1018', .45));
      g.strokeStyle = P2.col; g.strokeRect(cx - cw/2 + .5, cy - h/2 + .5, cw - 1, h - 1); }
  }
}

// ── the collection ─────────────────────────────────────────────────────────
let colSort = 'ovr', colFilter = 'all', colSel = null, colScroll = 0, cardFlip = false;
function myCards(){
  let list = G.cards.slice();
  if (colFilter === 'hit') list = list.filter(c => !isPitcher(c));

// ── simulating ─────────────────────────────────────────────────────────────
function simPitch(){
  // A quick at-bat with no animation. The base rates are the ones the user wants: about a
  // .300 average, one home run per team per game and 22% strikeouts. A player's ratings push
  // each rate up or down from there.
  const b = M.batter, p = curPitcher();
  // Ratings swing the result hard: a lineup of red cards (110+) should bury an average team,
  // and a green-card lineup (70s) should get buried. 85 is the middle of the league.
  const con = (b.contact - 85) / 30, pow = (b.power - 85) / 30, spd = (b.speed - 85) / 30;
  const vel = (p.velocity - 85) / 30, ctl = (p.control - 85) / 30, tired = fatigue() * .35;
  let k  = clamp(.22 - con * .040 + vel * .060 - tired * .05, .02, .55);
  let bb = clamp(.085 + con * .010 - ctl * .034 + tired * .10, .01, .30);
  let hr = clamp(.026 + pow * .015 - vel * .014 + tired * .012, .001, .20);
  let h1 = clamp(.190 + con * .032 + spd * .012 - ctl * .034 + tired * .03, .03, .36);
  let h2 = clamp(.055 + con * .010 + pow * .008 - ctl * .013, .006, .14);
  let h3 = clamp(.005 + spd * .004, 0, .03);
  // test hook: pretend the person playing is better than the computer would be with the same cards
  if (window.__EDGE && weBat()){ const e = window.__EDGE; h1 *= e; h2 *= e; h3 *= e; hr *= e; k /= e; }
  if (window.__EDGE && !weBat()) k *= window.__EDGE;
  const r = Math.random();
  let a = k;                       if (r < a) return applyPlay('k');
  a += bb;                         if (r < a) return applyPlay(chance(.07) ? 'hbp' : 'bb');
  a += hr;                         if (r < a) return applyPlay('hr');
  a += h1;                         if (r < a) return applyPlay('single');
  a += h2;                         if (r < a) return applyPlay('double');
  a += h3;                         if (r < a) return applyPlay('triple');
  a += .012;                       if (r < a) return applyPlay('error');
  // everything left is an out in play; with a runner on first a grounder can turn two
  if (M.bases[0] && M.outs < 2 && chance(.22)) return applyPlay('dp');
  return applyPlay(pick(['groundout','groundout','flyout','flyout','lineout']));
}
function simRest(){
  let guard = 0;
  while (!M.over && guard++ < 4000) simPitch();
  if (!M.over) gameOver();
  phase = 'over';
}
function simHalfIfNeeded(){
  // if the user only plays one side, sim the other side's half inning
  if (M.over) return false;
  if ((M.mode === 'offense' && !weBat()) || (M.mode === 'defense' && weBat())){
    const side = M.top, inn = M.inning;
    let guard = 0;
    while (!M.over && M.top === side && M.inning === inn && guard++ < 300) simPitch();
    return true;
  }
  return false;
}

let touch = null;
const toPix = e => ({ x: ((e.clientX * (devicePixelRatio || 1)) - OX) / SC, y: ((e.clientY * (devicePixelRatio || 1)) - OY) / SC });

function down(e){
  const p = toPix(e);
  touch = { x0:p.x, y0:p.y, x:p.x, y:p.y, t:performance.now(), used:false };
  for (const b of btns) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h){ b.fn(); touch.used = true; return; }

    // tap inside the zone area to aim and throw
    if (p.y > 100 && p.y < H - 36){
      aim.x = clamp((p.x - (ZONE.x + ZONE.w / 2)) / (ZONE.w / 2), -2, 2);
      aim.y = clamp((p.y - (ZONE.y + ZONE.h / 2)) / (ZONE.h / 2), -2, 2);
      P.winding = { t:0, ax:aim.x, ay:aim.y }; phase = 'atbat'; touch.used = true;
    }
  }
}

//  MAIN LOOP
// ───────────────────────────────────────────────────────────────────────────
let last = performance.now();
function loop(now){
  const dt = Math.min(50, now - last); last = now; frame++;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#05070b'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(SC, 0, 0, SC, OX, OY);

  if (M) M.exc = Math.max(0, M.exc - dt / 1400);

  if (phase === 'menu'){ if (OPEN) openTick(dt); drawMenu(); }
  else if (phase === 'over'){ drawBatterViewSafe(dt); drawOver(); }
  else if (phase === 'gmenu'){ drawBatterViewSafe(dt); drawGameMenu(); }
  else if (phase === 'matchup'){ drawMatchup(); drawGameMenuBtn(); }
  else if (phase === 'play'){
    P.playT += dt;
    drawPlay(P.playT);
    if (P.playT > 400 && !P.applied){ P.applied = true; applyPlay(P.play); }
    if (P.playT > 1900){ if (!M.over){ if (!simHalfIfNeeded()) {} if (!M.over) nextPitch(); if (!M.over && phase === 'play') phase = userPitches() ? 'pitching' : 'atbat'; } }
    btns = []; drawGameMenuBtn();
  }
  else if (M){
    // the computer takes its time, winds up, then lets go
    if (P && !P.thrown && !userPitches()){
      P.ready += dt;
      if (P.ready > 1500){ P.windup = clamp((P.ready - 1500) / 900, 0, 1);
        if (P.windup >= 1) aiPitch(); }
    }
    // the pitch flying in
    if (P && P.thrown && !P.done){
      P.t += dt;
      if (swing) swing.t += dt;
      const f = P.t / P.dur;
      if (f >= 1 && !P.hitAway) P.caught += dt;
      if (f >= 1 && !P.result){
        // nobody swung: ball or called strike
        P.result = inZone() ? 'called' : 'ball';
        say(P.result === 'called' ? 'STRIKE' : 'BALL');
        finishPitch();
      }
    }
    // our own windup, then the release
    if (P && P.winding && !P.thrown){
      P.winding.t += dt; P.windup = clamp(P.winding.t / 900, 0, 1);
      if (P.windup >= 1){ throwPitch(pitchSel, P.winding.ax, P.winding.ay); P.winding = null; }
    }
    if (P && P.done){
      P.waitT += dt;
      if (P.waitT > PITCH_GAP){
        if (!M.over){ if (!simHalfIfNeeded() || !M.over){ if (!M.over) nextPitch(); } }
      }
    }
    M.msgT += dt; if (M.msgT > 1400) M.msg = null;
    drawBatterView(dt);
    btns = [];
    if (phase === 'pitching') drawPitchUI();
    else if (userBats() && !swing) textb('SWIPE UP TO SWING', W - 30, H - 14, '#ffffff55', 7, 'right');
    drawGameMenuBtn();
    if (phase === 'pitching'){
      const p = curPitcher(), keys = Object.keys(p.pitches);
      keys.forEach((k, i) => btns.push({ x: 6 + i * 70, y: H - 30, w:66, h:15, fn: () => pitchSel = k }));
    }
  }
  requestAnimationFrame(loop);
}
function drawBatterViewSafe(dt){ try { drawBatterView(dt); } catch(e){ R(0,0,W,H,'#0b1018'); } }

// ── boot ───────────────────────────────────────────────────────────────────
load();
requestAnimationFrame(loop);
})();
</script>
